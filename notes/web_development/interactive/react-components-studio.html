<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>React 18 Component Studio: Cinema Ticket Booking</title>
  <!-- React 18, ReactDOM 18 & Babel Standalone CDN -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    :root {
      --bg-dark: #070b14;
      --bg-surface: #0f172a;
      --bg-card: #1e293b;
      --border-color: #334155;
      --react-blue: #38bdf8;
      --gold: #f59e0b;
      --success: #10b981;
      --danger: #ef4444;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      line-height: 1.5;
    }

    header.app-header {
      background: var(--bg-surface);
      border-bottom: 1px solid var(--border-color);
      padding: 16px 28px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 16px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .badge-react {
      background: #38bdf8;
      color: #0f172a;
      font-weight: 800;
      font-size: 12px;
      padding: 4px 8px;
      border-radius: 6px;
    }

    .main-grid {
      max-width: 1350px;
      margin: 24px auto;
      padding: 0 20px;
      display: grid;
      grid-template-columns: 1fr 380px;
      gap: 28px;
    }

    @media (max-width: 1000px) {
      .main-grid { grid-template-columns: 1fr; }
    }

    .card {
      background: var(--bg-surface);
      border: 1px solid var(--border-color);
      border-radius: 14px;
      padding: 24px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.4);
    }

    /* Screen Visualizer */
    .screen-container {
      perspective: 500px;
      margin: 20px 0 35px;
      text-align: center;
    }

    .cinema-screen {
      height: 14px;
      background: linear-gradient(to bottom, #ffffff, rgba(255, 255, 255, 0.2));
      border-radius: 50%;
      transform: rotateX(-30deg) scale(0.9);
      box-shadow: 0 6px 30px rgba(56, 189, 248, 0.6);
      margin: 0 auto;
      max-width: 480px;
    }

    .screen-label {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 3px;
      color: #64748b;
      margin-top: 10px;
      font-weight: 700;
    }

    /* Seating Matrix */
    .seat-grid {
      display: flex;
      flex-direction: column;
      gap: 10px;
      align-items: center;
      margin: 20px 0;
    }

    .seat-row {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    .row-label {
      width: 20px;
      font-size: 12px;
      font-weight: 700;
      color: var(--text-muted);
      text-align: center;
    }

    .seat {
      width: 32px;
      height: 30px;
      border-radius: 8px 8px 4px 4px;
      background: #334155;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 10px;
      font-weight: 700;
      color: #94a3b8;
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
      user-select: none;
      position: relative;
    }

    .seat:hover:not(.reserved) {
      transform: scale(1.15);
      background: #475569;
      color: white;
    }

    .seat.vip {
      border: 1px solid var(--gold);
    }

    .seat.selected {
      background: #38bdf8 !important;
      color: #0f172a !important;
      box-shadow: 0 0 12px #38bdf8;
      transform: scale(1.1);
    }

    .seat.reserved {
      background: #1e293b;
      color: #475569;
      cursor: not-allowed;
      opacity: 0.45;
    }

    /* Legend */
    .seat-legend {
      display: flex;
      justify-content: center;
      gap: 20px;
      margin-top: 24px;
      font-size: 12px;
      color: var(--text-muted);
      flex-wrap: wrap;
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .legend-box {
      width: 16px;
      height: 16px;
      border-radius: 4px;
    }

    /* Concession Addon Items */
    .concession-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #111827;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 10px 14px;
      margin-bottom: 10px;
    }

    .qty-btn {
      width: 24px;
      height: 24px;
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      color: white;
      border-radius: 4px;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .qty-btn:hover {
      background: #475569;
    }

    /* Modal */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(6px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      padding: 20px;
    }

    .modal-card {
      background: var(--bg-surface);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      max-width: 520px;
      width: 100%;
      padding: 28px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.8);
      animation: modalSlide 0.25s ease-out;
    }

    @keyframes modalSlide {
      from { opacity: 0; transform: scale(0.95); }
      to { opacity: 1; transform: scale(1); }
    }

    .receipt-barcode {
      height: 48px;
      background: repeating-linear-gradient(
        90deg,
        #fff 0,
        #fff 2px,
        transparent 2px,
        transparent 5px,
        #fff 5px,
        #fff 8px,
        transparent 8px,
        transparent 11px
      );
      margin: 16px 0;
      opacity: 0.8;
      border-radius: 4px;
    }
  </style>
</head>
<body>

  <div id="reactAppRoot">
    <!-- React Component Application Mounts Here -->
  </div>

  <script type="text/babel">
    const { useState, useMemo } = React;

    const MOVIES = [
      {
        id: 'interstellar',
        title: 'Interstellar: 10th Anniversary (IMAX 70mm)',
        genre: 'Sci-Fi / Adventure',
        rating: 'PG-13',
        duration: '169 min',
        showtimes: ['2:00 PM', '5:30 PM', '8:45 PM'],
        stdPrice: 15,
        vipPrice: 24,
        poster: '🪐'
      },
      {
        id: 'dune2',
        title: 'Dune: Part Two (Dolby Cinema Laser)',
        genre: 'Action / Sci-Fi',
        rating: 'PG-13',
        duration: '166 min',
        showtimes: ['1:15 PM', '4:45 PM', '8:15 PM', '10:45 PM'],
        stdPrice: 16,
        vipPrice: 25,
        poster: '🏜️'
      },
      {
        id: 'spiderverse',
        title: 'Spider-Man: Across the Spider-Verse',
        genre: 'Animation / Action',
        rating: 'PG',
        duration: '140 min',
        showtimes: ['12:30 PM', '3:45 PM', '7:00 PM'],
        stdPrice: 14,
        vipPrice: 22,
        poster: '🕷️'
      }
    ];

    const CONCESSIONS = [
      { id: 'popcorn', name: 'Gourmet Truffle Popcorn (Large)', price: 8, icon: '🍿' },
      { id: 'soda', name: 'Craft Fountain Beverage (Free Refills)', price: 5, icon: '🥤' },
      { id: 'nachos', name: 'Queso Nachos Deluxe with Jalapeños', price: 7, icon: '🧀' }
    ];

    // Rows A-F, Seats 1-8
    const INITIAL_RESERVED = ['A3', 'A4', 'C1', 'D7', 'D8', 'F4', 'F5'];

    function MovieBookingApp() {
      const [selectedMovieId, setSelectedMovieId] = useState('interstellar');
      const [selectedTime, setSelectedTime] = useState('5:30 PM');
      const [selectedSeats, setSelectedSeats] = useState(['C4', 'C5']);
      const [concessionsCount, setConcessionsCount] = useState({ popcorn: 1, soda: 2, nachos: 0 });
      const [isModalOpen, setIsModalOpen] = useState(false);
      const [bookingSuccess, setBookingSuccess] = useState(false);
      const [customer, setCustomer] = useState({ name: 'Jordan Taylor', email: 'jordan.t@university.edu' });

      const currentMovie = useMemo(() => {
        return MOVIES.find(m => m.id === selectedMovieId);
      }, [selectedMovieId]);

      // Calculate totals
      const { ticketTotal, concessionTotal, bookingFee, tax, grandTotal } = useMemo(() => {
        let tTotal = 0;
        selectedSeats.forEach(seatCode => {
          const row = seatCode.charAt(0);
          const isVip = (row === 'E' || row === 'F');
          tTotal += isVip ? currentMovie.vipPrice : currentMovie.stdPrice;
        });

        let cTotal = 0;
        CONCESSIONS.forEach(c => {
          cTotal += (concessionsCount[c.id] || 0) * c.price;
        });

        const bFee = selectedSeats.length * 1.50;
        const subtotal = tTotal + cTotal + bFee;
        const salesTax = subtotal * 0.0825;
        const total = subtotal + salesTax;

        return {
          ticketTotal: tTotal,
          concessionTotal: cTotal,
          bookingFee: bFee,
          tax: salesTax,
          grandTotal: total
        };
      }, [selectedSeats, concessionsCount, currentMovie]);

      function toggleSeat(seatCode) {
        if (INITIAL_RESERVED.includes(seatCode)) return;

        if (selectedSeats.includes(seatCode)) {
          setSelectedSeats(selectedSeats.filter(s => s !== seatCode));
        } else {
          if (selectedSeats.length >= 8) {
            alert('Maximum 8 tickets per booking reservation.');
            return;
          }
          setSelectedSeats([...selectedSeats, seatCode]);
        }
      }

      function updateConcession(id, delta) {
        const cur = concessionsCount[id] || 0;
        const nxt = Math.max(0, cur + delta);
        setConcessionsCount({ ...concessionsCount, [id]: nxt });
      }

      function resetBooking() {
        setSelectedSeats([]);
        setConcessionsCount({ popcorn: 0, soda: 0, nachos: 0 });
        setIsModalOpen(false);
        setBookingSuccess(false);
      }

      const rows = ['A', 'B', 'C', 'D', 'E', 'F'];
      const cols = [1, 2, 3, 4, 5, 6, 7, 8];

      return (
        <div>
          {/* Header */}
          <header class="app-header">
            <div class="brand">
              <span class="badge-react">REACT 18 COMPONENT APP</span>
              <h1 style={{ fontSize: '18px', fontWeight: 800 }}>Cinema Booking Studio</h1>
            </div>
            <div style={{ fontSize: '13px', color: 'var(--text-muted)' }}>
              Stateful React Application with Real-Time Subtotal Engine
            </div>
          </header>

          <main class="main-grid">
            {/* Left: Movie Selector & Seating Chart */}
            <div style={{ display: 'flex', flexDirection: 'column', gap: '24px' }}>

              {/* Movie & Showtime Card */}
              <div class="card">
                <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '14px', flexWrap: 'wrap', gap: '10px' }}>
                  <div>
                    <span style={{ fontSize: '11px', textTransform: 'uppercase', color: 'var(--text-muted)', fontWeight: 700 }}>Select Feature Film</span>
                    <h2 style={{ fontSize: '18px', fontWeight: 800, color: '#38bdf8' }}>{currentMovie.poster} {currentMovie.title}</h2>
                  </div>

                  <select
                    value={selectedMovieId}
                    onChange={(e) => setSelectedMovieId(e.target.value)}
                    style={{ background: '#070b14', color: 'white', border: '1px solid var(--border-color)', padding: '8px 12px', borderRadius: '8px', fontSize: '13px', outline: 'none' }}
                  >
                    {MOVIES.map(m => (
                      <option key={m.id} value={m.id}>{m.title}</option>
                    ))}
                  </select>
                </div>

                <div style={{ display: 'flex', gap: '10px', alignItems: 'center', flexWrap: 'wrap' }}>
                  <span style={{ fontSize: '12px', color: 'var(--text-muted)', fontWeight: 700 }}>Available Showtimes:</span>
                  {currentMovie.showtimes.map(time => (
                    <button
                      key={time}
                      onClick={() => setSelectedTime(time)}
                      style={{
                        background: selectedTime === time ? '#38bdf8' : '#1e293b',
                        color: selectedTime === time ? '#070b14' : 'white',
                        border: '1px solid var(--border-color)',
                        padding: '6px 14px',
                        borderRadius: '6px',
                        fontSize: '12px',
                        fontWeight: 700,
                        cursor: 'pointer',
                        transition: 'all 0.2s'
                      }}
                    >
                      {time}
                    </button>
                  ))}
                </div>
              </div>

              {/* Seating Matrix Stage */}
              <div class="card">
                <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '10px' }}>
                  <h3 style={{ fontSize: '15px', fontWeight: 700, color: 'white' }}>Hall 4: Curved Projection Auditorium</h3>
                  <span style={{ fontSize: '12px', color: 'var(--text-muted)' }}>{selectedSeats.length} Seats Selected</span>
                </div>

                {/* Curved Screen */}
                <div class="screen-container">
                  <div class="cinema-screen"></div>
                  <div class="screen-label">IMAX IMMERSIVE LASER SCREEN</div>
                </div>

                {/* Seats Grid */}
                <div class="seat-grid">
                  {rows.map(row => {
                    const isVipRow = (row === 'E' || row === 'F');
                    return (
                      <div key={row} class="seat-row">
                        <span class="row-label">{row}</span>
                        {cols.map(col => {
                          const seatCode = `${row}${col}`;
                          const isReserved = INITIAL_RESERVED.includes(seatCode);
                          const isSelected = selectedSeats.includes(seatCode);

                          let seatClasses = 'seat';
                          if (isVipRow) seatClasses += ' vip';
                          if (isReserved) seatClasses += ' reserved';
                          if (isSelected) seatClasses += ' selected';

                          return (
                            <div
                              key={seatCode}
                              class={seatClasses}
                              onClick={() => toggleSeat(seatCode)}
                              title={`${seatCode} (${isVipRow ? 'VIP Lounger - $' + currentMovie.vipPrice : 'Standard - $' + currentMovie.stdPrice})`}
                            >
                              {col}
                            </div>
                          );
                        })}
                        <span class="row-label">{row}</span>
                      </div>
                    );
                  })}
                </div>

                {/* Legend */}
                <div class="seat-legend">
                  <div class="legend-item">
                    <div class="legend-box" style={{ background: '#334155' }}></div>
                    <span>Standard (${currentMovie.stdPrice})</span>
                  </div>
                  <div class="legend-item">
                    <div class="legend-box" style={{ background: '#1e293b', border: '1px solid var(--gold)' }}></div>
                    <span>VIP Lounger (${currentMovie.vipPrice})</span>
                  </div>
                  <div class="legend-item">
                    <div class="legend-box" style={{ background: '#38bdf8' }}></div>
                    <span>Selected</span>
                  </div>
                  <div class="legend-item">
                    <div class="legend-box" style={{ background: '#1e293b', opacity: 0.45 }}></div>
                    <span>Reserved</span>
                  </div>
                </div>
              </div>

            </div>

            {/* Right: Order Summary Sidebar */}
            <div style={{ display: 'flex', flexDirection: 'column', gap: '20px' }}>
              <div class="card">
                <h3 style={{ fontSize: '16px', fontWeight: 700, color: '#38bdf8', marginBottom: '16px' }}>
                  Booking Summary
                </h3>

                {/* Selected Seats Tag List */}
                <div style={{ marginBottom: '16px' }}>
                  <label style={{ fontSize: '11px', textTransform: 'uppercase', color: 'var(--text-muted)', fontWeight: 700, display: 'block', marginBottom: '6px' }}>
                    Reserved Seats ({selectedSeats.length})
                  </label>
                  {selectedSeats.length === 0 ? (
                    <div style={{ fontSize: '13px', color: '#64748b', fontStyle: 'italic' }}>Please pick seats on the chart.</div>
                  ) : (
                    <div style={{ display: 'flex', gap: '6px', flexWrap: 'wrap' }}>
                      {selectedSeats.map(s => (
                        <span key={s} style={{ background: '#0284c7', color: 'white', padding: '3px 8px', borderRadius: '4px', fontSize: '12px', fontWeight: 700 }}>
                          {s}
                        </span>
                      ))}
                    </div>
                  )}
                </div>

                {/* Concessions Adder */}
                <div style={{ marginBottom: '20px' }}>
                  <label style={{ fontSize: '11px', textTransform: 'uppercase', color: 'var(--text-muted)', fontWeight: 700, display: 'block', marginBottom: '10px' }}>
                    Concession Add-ons
                  </label>
                  {CONCESSIONS.map(item => (
                    <div key={item.id} class="concession-item">
                      <div>
                        <div style={{ fontSize: '12px', fontWeight: 600 }}>{item.icon} {item.name}</div>
                        <div style={{ fontSize: '11px', color: 'var(--text-muted)' }}>${item.price}.00 each</div>
                      </div>
                      <div style={{ display: 'flex', alignItems: 'center', gap: '8px' }}>
                        <button class="qty-btn" onClick={() => updateConcession(item.id, -1)}>-</button>
                        <span style={{ fontSize: '13px', fontWeight: 700, minWidth: '16px', textAlign: 'center' }}>
                          {concessionsCount[item.id] || 0}
                        </span>
                        <button class="qty-btn" onClick={() => updateConcession(item.id, 1)}>+</button>
                      </div>
                    </div>
                  ))}
                </div>

                {/* Line Item Pricing */}
                <div style={{ borderTop: '1px solid var(--border-color)', paddingTop: '14px', fontSize: '13px', display: 'flex', flexDirection: 'column', gap: '8px' }}>
                  <div style={{ display: 'flex', justifyContent: 'space-between', color: 'var(--text-muted)' }}>
                    <span>Tickets Subtotal</span>
                    <span style={{ color: 'white', fontWeight: 600 }}>${ticketTotal.toFixed(2)}</span>
                  </div>
                  <div style={{ display: 'flex', justifyContent: 'space-between', color: 'var(--text-muted)' }}>
                    <span>Concessions Subtotal</span>
                    <span style={{ color: 'white', fontWeight: 600 }}>${concessionTotal.toFixed(2)}</span>
                  </div>
                  <div style={{ display: 'flex', justifyContent: 'space-between', color: 'var(--text-muted)' }}>
                    <span>Convenience Fee ($1.50/seat)</span>
                    <span style={{ color: 'white', fontWeight: 600 }}>${bookingFee.toFixed(2)}</span>
                  </div>
                  <div style={{ display: 'flex', justifyContent: 'space-between', color: 'var(--text-muted)' }}>
                    <span>Sales Tax (8.25%)</span>
                    <span style={{ color: 'white', fontWeight: 600 }}>${tax.toFixed(2)}</span>
                  </div>

                  <div style={{ display: 'flex', justifyContent: 'space-between', fontSize: '17px', fontWeight: 800, marginTop: '8px', borderTop: '1px solid var(--border-color)', paddingTop: '10px' }}>
                    <span>Grand Total:</span>
                    <span style={{ color: '#38bdf8' }}>${grandTotal.toFixed(2)}</span>
                  </div>
                </div>

                {/* Checkout Trigger */}
                <button
                  disabled={selectedSeats.length === 0}
                  onClick={() => setIsModalOpen(true)}
                  style={{
                    width: '100%',
                    marginTop: '20px',
                    padding: '12px',
                    borderRadius: '8px',
                    background: selectedSeats.length === 0 ? '#334155' : 'linear-gradient(135deg, #0284c7, #38bdf8)',
                    color: selectedSeats.length === 0 ? '#64748b' : '#070b14',
                    fontWeight: 800,
                    fontSize: '14px',
                    border: 'none',
                    cursor: selectedSeats.length === 0 ? 'not-allowed' : 'pointer',
                    boxShadow: selectedSeats.length === 0 ? 'none' : '0 4px 15px rgba(56, 189, 248, 0.4)'
                  }}
                >
                  {selectedSeats.length === 0 ? 'Select Seats to Continue' : `Proceed to Checkout ($${grandTotal.toFixed(2)})`}
                </button>
              </div>
            </div>
          </main>

          {/* Checkout & Confirmation Modal */}
          {isModalOpen && (
            <div class="modal-overlay">
              <div class="modal-card">
                {!bookingSuccess ? (
                  <div>
                    <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '16px' }}>
                      <h3 style={{ fontSize: '18px', fontWeight: 800, color: 'white' }}>Complete Reservation</h3>
                      <button onClick={() => setIsModalOpen(false)} style={{ background: 'none', border: 'none', color: '#94a3b8', fontSize: '18px', cursor: 'pointer' }}>✕</button>
                    </div>

                    <div style={{ background: '#111827', padding: '14px', borderRadius: '8px', marginBottom: '16px', fontSize: '13px' }}>
                      <div><strong>Film:</strong> {currentMovie.title}</div>
                      <div><strong>Showtime:</strong> {selectedTime}</div>
                      <div><strong>Seats:</strong> {selectedSeats.join(', ')}</div>
                      <div style={{ marginTop: '6px', fontWeight: 700, color: '#38bdf8' }}>Total Payable: ${grandTotal.toFixed(2)}</div>
                    </div>

                    <div style={{ display: 'flex', flexDirection: 'column', gap: '12px', marginBottom: '20px' }}>
                      <div>
                        <label style={{ fontSize: '11px', color: 'var(--text-muted)', fontWeight: 700, textTransform: 'uppercase' }}>Full Name</label>
                        <input
                          type="text"
                          value={customer.name}
                          onChange={(e) => setCustomer({ ...customer, name: e.target.value })}
                          style={{ width: '100%', background: '#070b14', border: '1px solid var(--border-color)', color: 'white', padding: '8px 12px', borderRadius: '6px', fontSize: '13px', marginTop: '4px' }}
                        />
                      </div>
                      <div>
                        <label style={{ fontSize: '11px', color: 'var(--text-muted)', fontWeight: 700, textTransform: 'uppercase' }}>Email Confirmation</label>
                        <input
                          type="email"
                          value={customer.email}
                          onChange={(e) => setCustomer({ ...customer, email: e.target.value })}
                          style={{ width: '100%', background: '#070b14', border: '1px solid var(--border-color)', color: 'white', padding: '8px 12px', borderRadius: '6px', fontSize: '13px', marginTop: '4px' }}
                        />
                      </div>
                    </div>

                    <button
                      onClick={() => setBookingSuccess(true)}
                      style={{ width: '100%', padding: '12px', background: '#10b981', color: '#070b14', fontWeight: 800, border: 'none', borderRadius: '8px', cursor: 'pointer', fontSize: '14px' }}
                    >
                      Authorize Payment &amp; Confirm Booking
                    </button>
                  </div>
                ) : (
                  <div style={{ textAlign: 'center' }}>
                    <div style={{ fontSize: '42px', marginBottom: '8px' }}>🎟️</div>
                    <h3 style={{ fontSize: '20px', fontWeight: 800, color: '#10b981', marginBottom: '6px' }}>Booking Confirmed!</h3>
                    <p style={{ fontSize: '13px', color: 'var(--text-muted)', marginBottom: '16px' }}>
                      E-Ticket confirmation has been dispatched to <strong>{customer.email}</strong>.
                    </p>

                    <div style={{ background: '#111827', border: '1px dashed #334155', borderRadius: '10px', padding: '16px', textAlign: 'left', fontSize: '12px', margin: '14px 0' }}>
                      <div style={{ display: 'flex', justifyContent: 'space-between', marginBottom: '8px' }}>
                        <span>Booking Code: <strong style={{ color: '#38bdf8' }}>TK-8942-X</strong></span>
                        <span>Hall 4 (Laser)</span>
                      </div>
                      <div><strong>Movie:</strong> {currentMovie.title}</div>
                      <div><strong>Time:</strong> Today @ {selectedTime}</div>
                      <div><strong>Seats:</strong> {selectedSeats.join(', ')}</div>
                      <div class="receipt-barcode"></div>
                      <div style={{ textAlign: 'center', fontSize: '10px', color: '#64748b' }}>Scan at theater turnstile for admission</div>
                    </div>

                    <button
                      onClick={resetBooking}
                      style={{ width: '100%', padding: '10px', background: '#1e293b', color: 'white', border: '1px solid var(--border-color)', borderRadius: '8px', cursor: 'pointer', fontWeight: 700 }}
                    >
                      Book Another Screening
                    </button>
                  </div>
                )}
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('reactAppRoot')).render(<MovieBookingApp />);
  </script>
</body>
</html>
