<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tailwind CSS Utility-First Interactive Playground</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    /* Custom styling for the studio frame & controls */
    body {
      background-color: #0b0f19;
      color: #f8fafc;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    .custom-scroll::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    .custom-scroll::-webkit-scrollbar-track {
      background: #111827;
    }
    .custom-scroll::-webkit-scrollbar-thumb {
      background: #374151;
      border-radius: 3px;
    }

    /* Fallback utility classes in case CDN is unreachable */
    .f-flex { display: flex; }
    .f-col { flex-direction: column; }
    .f-center { align-items: center; justify-content: center; }
  </style>
</head>
<body class="min-h-screen flex flex-col">

  <!-- Studio Header -->
  <header class="bg-slate-900 border-b border-slate-800 px-6 py-4 sticky top-0 z-50 shadow-md">
    <div class="max-w-7xl mx-auto flex flex-wrap items-center justify-between gap-4">
      <div class="flex items-center gap-3">
        <span class="bg-cyan-500/20 text-cyan-400 border border-cyan-500/40 text-xs font-bold px-2.5 py-1 rounded-md uppercase tracking-wider">
          Tailwind v3.4
        </span>
        <h1 class="text-lg font-bold text-white flex items-center gap-2">
          <span>🎨</span> Utility-First Interactive Playground
        </h1>
      </div>

      <!-- Quick Presets -->
      <div class="flex items-center gap-2 flex-wrap">
        <span class="text-xs font-semibold text-slate-400 uppercase">Presets:</span>
        <button onclick="applyPreset('product')" class="px-2.5 py-1 text-xs font-medium rounded bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 transition">
          🛍️ Product Card
        </button>
        <button onclick="applyPreset('profile')" class="px-2.5 py-1 text-xs font-medium rounded bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 transition">
          👤 User Profile
        </button>
        <button onclick="applyPreset('toast')" class="px-2.5 py-1 text-xs font-medium rounded bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 transition">
          🔔 Notification Toast
        </button>
        <button onclick="applyPreset('stats')" class="px-2.5 py-1 text-xs font-medium rounded bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 transition">
          📊 Metric Widget
        </button>
      </div>
    </div>
  </header>

  <!-- Main Workspace -->
  <main class="flex-1 max-w-7xl w-full mx-auto p-6 grid grid-cols-1 lg:grid-cols-12 gap-6">

    <!-- Left Controls Dashboard (5 cols) -->
    <div class="lg:col-span-5 flex flex-col gap-5">
      <div class="bg-slate-900 border border-slate-800 rounded-xl p-5 shadow-lg">
        <h2 class="text-sm font-bold text-cyan-400 uppercase tracking-wider mb-4 flex items-center justify-between">
          <span>⚡ Utility Class Controls</span>
          <button onclick="resetControls()" class="text-xs text-slate-400 hover:text-white transition font-normal underline">
            Reset All
          </button>
        </h2>

        <!-- Accordion / Control Sections -->
        <div class="space-y-4 max-h-[72vh] overflow-y-auto pr-2 custom-scroll">

          <!-- 1. Layout & Flexbox -->
          <div class="bg-slate-800/60 border border-slate-700/60 rounded-lg p-3.5">
            <h3 class="text-xs font-bold text-slate-300 uppercase mb-3 flex items-center gap-2">
              <span class="w-2 h-2 rounded-full bg-cyan-400"></span> Layout &amp; Flexbox
            </h3>
            <div class="grid grid-cols-2 gap-3 text-xs">
              <div>
                <label class="block text-slate-400 mb-1">Display</label>
                <select id="ctrlDisplay" onchange="updateLivePreview()" class="w-full bg-slate-900 border border-slate-700 rounded p-1.5 text-white outline-none focus:border-cyan-400">
                  <option value="flex" selected>flex</option>
                  <option value="inline-flex">inline-flex</option>
                  <option value="block">block</option>
                  <option value="grid">grid</option>
                </select>
              </div>

              <div>
                <label class="block text-slate-400 mb-1">Direction</label>
                <select id="ctrlDirection" onchange="updateLivePreview()" class="w-full bg-slate-900 border border-slate-700 rounded p-1.5 text-white outline-none focus:border-cyan-400">
                  <option value="flex-col" selected>flex-col</option>
                  <option value="flex-row">flex-row</option>
                  <option value="flex-row-reverse">flex-row-reverse</option>
                </select>
              </div>

              <div>
                <label class="block text-slate-400 mb-1">Justify</label>
                <select id="ctrlJustify" onchange="updateLivePreview()" class="w-full bg-slate-900 border border-slate-700 rounded p-1.5 text-white outline-none focus:border-cyan-400">
                  <option value="justify-start">justify-start</option>
                  <option value="justify-center">justify-center</option>
                  <option value="justify-between" selected>justify-between</option>
                  <option value="justify-around">justify-around</option>
                  <option value="justify-evenly">justify-evenly</option>
                </select>
              </div>

              <div>
                <label class="block text-slate-400 mb-1">Items Align</label>
                <select id="ctrlItems" onchange="updateLivePreview()" class="w-full bg-slate-900 border border-slate-700 rounded p-1.5 text-white outline-none focus:border-cyan-400">
                  <option value="items-start">items-start</option>
                  <option value="items-center" selected>items-center</option>
                  <option value="items-end">items-end</option>
                  <option value="items-stretch">items-stretch</option>
                </select>
              </div>

              <div class="col-span-2">
                <label class="block text-slate-400 mb-1">Gap Spacing</label>
                <select id="ctrlGap" onchange="updateLivePreview()" class="w-full bg-slate-900 border border-slate-700 rounded p-1.5 text-white outline-none focus:border-cyan-400">
                  <option value="gap-0">gap-0 (0px)</option>
                  <option value="gap-2">gap-2 (8px)</option>
                  <option value="gap-4" selected>gap-4 (16px)</option>
                  <option value="gap-6">gap-6 (24px)</option>
                  <option value="gap-8">gap-8 (32px)</option>
                </select>
              </div>
            </div>
          </div>

          <!-- 2. Spacing (Padding & Margin) -->
          <div class="bg-slate-800/60 border border-slate-700/60 rounded-lg p-3.5">
            <h3 class="text-xs font-bold text-slate-300 uppercase mb-3 flex items-center gap-2">
              <span class="w-2 h-2 rounded-full bg-emerald-400"></span> Spacing (Padding &amp; Margin)
            </h3>
            <div class="grid grid-cols-2 gap-3 text-xs">
              <div>
                <label class="block text-slate-400 mb-1">Padding (p-*)</label>
                <select id="ctrlPadding" onchange="updateLivePreview()" class="w-full bg-slate-900 border border-slate-700 rounded p-1.5 text-white outline-none focus:border-cyan-400">
                  <option value="p-2">p-2 (8px)</option>
                  <option value="p-4">p-4 (16px)</option>
                  <option value="p-6" selected>p-6 (24px)</option>
                  <option value="p-8">p-8 (32px)</option>
                  <option value="px-6 py-4">px-6 py-4</option>
                </select>
              </div>

              <div>
                <label class="block text-slate-400 mb-1">Margin (m-*)</label>
                <select id="ctrlMargin" onchange="updateLivePreview()" class="w-full bg-slate-900 border border-slate-700 rounded p-1.5 text-white outline-none focus:border-cyan-400">
                  <option value="m-0" selected>m-0 (0px)</option>
                  <option value="m-2">m-2 (8px)</option>
                  <option value="m-4">m-4 (16px)</option>
                  <option value="my-4">my-4</option>
                  <option value="mx-auto">mx-auto</option>
                </select>
              </div>
            </div>
          </div>

          <!-- 3. Colors & Background -->
          <div class="bg-slate-800/60 border border-slate-700/60 rounded-lg p-3.5">
            <h3 class="text-xs font-bold text-slate-300 uppercase mb-3 flex items-center gap-2">
              <span class="w-2 h-2 rounded-full bg-indigo-400"></span> Colors &amp; Background
            </h3>
            <div class="grid grid-cols-2 gap-3 text-xs">
              <div>
                <label class="block text-slate-400 mb-1">Background</label>
                <select id="ctrlBg" onchange="updateLivePreview()" class="w-full bg-slate-900 border border-slate-700 rounded p-1.5 text-white outline-none focus:border-cyan-400">
                  <option value="bg-white" selected>bg-white</option>
                  <option value="bg-slate-900">bg-slate-900</option>
                  <option value="bg-slate-800">bg-slate-800</option>
                  <option value="bg-indigo-950">bg-indigo-950</option>
                  <option value="bg-gradient-to-br from-indigo-900 to-slate-900">Gradient (Indigo)</option>
                  <option value="bg-gradient-to-r from-cyan-900 to-blue-900">Gradient (Cyan)</option>
                </select>
              </div>

              <div>
                <label class="block text-slate-400 mb-1">Text Color</label>
                <select id="ctrlTextColor" onchange="updateLivePreview()" class="w-full bg-slate-900 border border-slate-700 rounded p-1.5 text-white outline-none focus:border-cyan-400">
                  <option value="text-slate-900" selected>text-slate-900</option>
                  <option value="text-white">text-white</option>
                  <option value="text-slate-300">text-slate-300</option>
                  <option value="text-cyan-400">text-cyan-400</option>
                  <option value="text-emerald-400">text-emerald-400</option>
                </select>
              </div>
            </div>
          </div>

          <!-- 4. Borders, Rounded & Shadows -->
          <div class="bg-slate-800/60 border border-slate-700/60 rounded-lg p-3.5">
            <h3 class="text-xs font-bold text-slate-300 uppercase mb-3 flex items-center gap-2">
              <span class="w-2 h-2 rounded-full bg-amber-400"></span> Borders, Radius &amp; Shadows
            </h3>
            <div class="grid grid-cols-2 gap-3 text-xs">
              <div>
                <label class="block text-slate-400 mb-1">Border Radius</label>
                <select id="ctrlRadius" onchange="updateLivePreview()" class="w-full bg-slate-900 border border-slate-700 rounded p-1.5 text-white outline-none focus:border-cyan-400">
                  <option value="rounded-none">rounded-none</option>
                  <option value="rounded-md">rounded-md (6px)</option>
                  <option value="rounded-xl">rounded-xl (12px)</option>
                  <option value="rounded-2xl" selected>rounded-2xl (16px)</option>
                  <option value="rounded-3xl">rounded-3xl (24px)</option>
                </select>
              </div>

              <div>
                <label class="block text-slate-400 mb-1">Box Shadow</label>
                <select id="ctrlShadow" onchange="updateLivePreview()" class="w-full bg-slate-900 border border-slate-700 rounded p-1.5 text-white outline-none focus:border-cyan-400">
                  <option value="shadow-none">shadow-none</option>
                  <option value="shadow-md">shadow-md</option>
                  <option value="shadow-lg">shadow-lg</option>
                  <option value="shadow-xl" selected>shadow-xl</option>
                  <option value="shadow-2xl">shadow-2xl</option>
                </select>
              </div>

              <div>
                <label class="block text-slate-400 mb-1">Border Width</label>
                <select id="ctrlBorderWidth" onchange="updateLivePreview()" class="w-full bg-slate-900 border border-slate-700 rounded p-1.5 text-white outline-none focus:border-cyan-400">
                  <option value="border-0">border-0</option>
                  <option value="border" selected>border (1px)</option>
                  <option value="border-2">border-2 (2px)</option>
                  <option value="border-4">border-4 (4px)</option>
                </select>
              </div>

              <div>
                <label class="block text-slate-400 mb-1">Border Color</label>
                <select id="ctrlBorderColor" onchange="updateLivePreview()" class="w-full bg-slate-900 border border-slate-700 rounded p-1.5 text-white outline-none focus:border-cyan-400">
                  <option value="border-slate-200" selected>border-slate-200</option>
                  <option value="border-slate-700">border-slate-700</option>
                  <option value="border-cyan-500">border-cyan-500</option>
                  <option value="border-indigo-500">border-indigo-500</option>
                </select>
              </div>
            </div>
          </div>

          <!-- 5. Interactive Transitions & Hover -->
          <div class="bg-slate-800/60 border border-slate-700/60 rounded-lg p-3.5">
            <h3 class="text-xs font-bold text-slate-300 uppercase mb-3 flex items-center gap-2">
              <span class="w-2 h-2 rounded-full bg-rose-400"></span> Hover &amp; Transitions
            </h3>
            <div class="grid grid-cols-2 gap-3 text-xs">
              <div>
                <label class="block text-slate-400 mb-1">Hover Scale</label>
                <select id="ctrlHover" onchange="updateLivePreview()" class="w-full bg-slate-900 border border-slate-700 rounded p-1.5 text-white outline-none focus:border-cyan-400">
                  <option value="">None</option>
                  <option value="hover:scale-105" selected>hover:scale-105</option>
                  <option value="hover:-translate-y-2">hover:-translate-y-2</option>
                </select>
              </div>

              <div>
                <label class="block text-slate-400 mb-1">Transition</label>
                <select id="ctrlTransition" onchange="updateLivePreview()" class="w-full bg-slate-900 border border-slate-700 rounded p-1.5 text-white outline-none focus:border-cyan-400">
                  <option value="transition-all duration-300" selected>transition-all duration-300</option>
                  <option value="transition-transform duration-200">transition-transform duration-200</option>
                  <option value="">None</option>
                </select>
              </div>
            </div>
          </div>

        </div>
      </div>
    </div>

    <!-- Right Live Preview & Generated HTML Output (7 cols) -->
    <div class="lg:col-span-7 flex flex-col gap-6">

      <!-- Rendered Stage -->
      <div class="bg-slate-900 border border-slate-800 rounded-xl p-5 shadow-lg flex-1 flex flex-col">
        <div class="flex items-center justify-between mb-4">
          <h2 class="text-sm font-bold text-cyan-400 uppercase tracking-wider flex items-center gap-2">
            <span>👁️</span> Live Rendered Card
          </h2>
          <span class="text-xs text-slate-400 font-mono" id="classCountBadge">11 utility classes active</span>
        </div>

        <!-- The Canvas Stage Area -->
        <div class="flex-1 bg-gradient-to-br from-slate-950 via-slate-900 to-slate-950 border border-slate-800 rounded-lg p-8 flex items-center justify-center min-h-[380px]">
          <!-- Target Styled Element -->
          <div id="targetCard" class="w-full max-w-sm flex flex-col justify-between items-center gap-4 p-6 m-0 bg-white text-slate-900 rounded-2xl shadow-xl border border-slate-200 hover:scale-105 transition-all duration-300 cursor-pointer">
            <!-- Dynamic Content based on Preset -->
            <div id="cardContent" class="w-full">
              <!-- Content rendered via JS -->
            </div>
          </div>
        </div>
      </div>

      <!-- Generated Tailwind HTML Code Snippet -->
      <div class="bg-slate-900 border border-slate-800 rounded-xl p-5 shadow-lg">
        <div class="flex items-center justify-between mb-3">
          <span class="text-xs font-bold text-slate-300 uppercase tracking-wider">
            Generated Tailwind HTML Markup
          </span>
          <button onclick="copySnippet()" class="px-3 py-1 bg-cyan-600 hover:bg-cyan-500 text-white rounded text-xs font-semibold transition flex items-center gap-1.5 shadow">
            <span>📋</span> Copy Snippet
          </button>
        </div>

        <div class="bg-slate-950 border border-slate-800 rounded-lg p-4 font-mono text-xs text-slate-300 overflow-x-auto leading-relaxed custom-scroll">
          <pre id="codeOutputPre" class="m-0"></pre>
        </div>
      </div>

    </div>

  </main>

  <script>
    let currentPreset = 'product';

    const presetsData = {
      product: {
        title: 'Sony WH-1000XM5 Wireless Headphones',
        badge: 'Top Rated',
        price: '$399.00',
        desc: 'Industry-leading noise cancelation with two processors and 8 microphones.',
        btnText: 'Add to Cart',
        icon: '🎧'
      },
      profile: {
        title: 'Dr. Sarah Lin',
        badge: 'Staff Engineer',
        desc: 'Specializing in distributed computing, edge AI runtime optimizations, and WebAssembly.',
        stats: '24 Projects • 14.2k Stars',
        btnText: 'Follow Profile',
        icon: '👩‍💻'
      },
      toast: {
        title: 'Deployment Succeeded',
        badge: 'Production',
        desc: 'v2.4.0 successfully rolled out to 12 edge nodes with 0 downtime.',
        btnText: 'View Logs',
        icon: '🚀'
      },
      stats: {
        title: 'Monthly Active Developers',
        badge: '+28.4% YoY',
        desc: 'Global registered engineering accounts on Cloud Studio.',
        metric: '1,429,880',
        btnText: 'View Analytics',
        icon: '📈'
      }
    };

    function renderCardContent() {
      const data = presetsData[currentPreset];
      const container = document.getElementById('cardContent');

      if (currentPreset === 'product') {
        container.innerHTML = `
          <div class="w-full flex items-center justify-between mb-2">
            <span class="text-2xl">${data.icon}</span>
            <span class="px-2.5 py-0.5 rounded-full text-xs font-bold bg-amber-100 text-amber-800">${data.badge}</span>
          </div>
          <h3 class="font-bold text-base mb-1">${data.title}</h3>
          <p class="text-xs opacity-75 mb-4">${data.desc}</p>
          <div class="w-full flex items-center justify-between pt-3 border-t border-slate-200/40">
            <span class="text-lg font-extrabold text-cyan-600">${data.price}</span>
            <button class="px-4 py-2 bg-slate-900 hover:bg-slate-800 text-white rounded-lg text-xs font-bold transition shadow">${data.btnText}</button>
          </div>
        `;
      } else if (currentPreset === 'profile') {
        container.innerHTML = `
          <div class="flex items-center gap-3 w-full mb-3">
            <div class="w-12 h-12 rounded-full bg-gradient-to-tr from-indigo-500 to-cyan-400 flex items-center justify-center text-xl shadow">
              ${data.icon}
            </div>
            <div>
              <h3 class="font-bold text-base leading-tight">${data.title}</h3>
              <span class="text-xs font-semibold text-indigo-500">${data.badge}</span>
            </div>
          </div>
          <p class="text-xs opacity-80 mb-3">${data.desc}</p>
          <div class="w-full flex items-center justify-between pt-3 border-t border-slate-200/40">
            <span class="text-xs font-medium opacity-70">${data.stats}</span>
            <button class="px-3.5 py-1.5 bg-indigo-600 hover:bg-indigo-500 text-white rounded-lg text-xs font-bold transition">${data.btnText}</button>
          </div>
        `;
      } else if (currentPreset === 'toast') {
        container.innerHTML = `
          <div class="flex items-start gap-3 w-full">
            <span class="text-2xl">${data.icon}</span>
            <div class="flex-1">
              <div class="flex items-center justify-between">
                <h4 class="font-bold text-sm">${data.title}</h4>
                <span class="text-[10px] font-bold px-2 py-0.5 rounded bg-emerald-100 text-emerald-800">${data.badge}</span>
              </div>
              <p class="text-xs opacity-80 mt-1">${data.desc}</p>
              <div class="mt-3 flex gap-2">
                <button class="px-3 py-1 bg-slate-900 text-white text-xs font-semibold rounded">${data.btnText}</button>
                <button class="px-3 py-1 bg-slate-200/60 text-slate-800 text-xs font-semibold rounded">Dismiss</button>
              </div>
            </div>
          </div>
        `;
      } else if (currentPreset === 'stats') {
        container.innerHTML = `
          <div class="w-full flex items-center justify-between mb-2">
            <span class="text-xs font-semibold uppercase tracking-wider opacity-75">${data.title}</span>
            <span class="text-xl">${data.icon}</span>
          </div>
          <div class="text-3xl font-black mb-1 tracking-tight">${data.metric}</div>
          <div class="flex items-center gap-1.5 text-xs text-emerald-600 font-bold mb-3">
            <span>↑</span> ${data.badge}
          </div>
          <button class="w-full py-2 bg-slate-900 text-white text-xs font-bold rounded-lg transition">${data.btnText}</button>
        `;
      }
    }

    function updateLivePreview() {
      const display = document.getElementById('ctrlDisplay').value;
      const direction = document.getElementById('ctrlDirection').value;
      const justify = document.getElementById('ctrlJustify').value;
      const items = document.getElementById('ctrlItems').value;
      const gap = document.getElementById('ctrlGap').value;
      const padding = document.getElementById('ctrlPadding').value;
      const margin = document.getElementById('ctrlMargin').value;
      const bg = document.getElementById('ctrlBg').value;
      const textColor = document.getElementById('ctrlTextColor').value;
      const radius = document.getElementById('ctrlRadius').value;
      const shadow = document.getElementById('ctrlShadow').value;
      const borderWidth = document.getElementById('ctrlBorderWidth').value;
      const borderColor = document.getElementById('ctrlBorderColor').value;
      const hover = document.getElementById('ctrlHover').value;
      const transition = document.getElementById('ctrlTransition').value;

      const classesArray = [
        'w-full max-w-sm',
        display,
        direction,
        justify,
        items,
        gap,
        padding,
        margin,
        bg,
        textColor,
        radius,
        shadow,
        borderWidth,
        borderColor,
        hover,
        transition,
        'cursor-pointer'
      ].filter(Boolean);

      const combinedClasses = classesArray.join(' ');
      const card = document.getElementById('targetCard');
      card.className = combinedClasses;

      // Update badge
      const count = combinedClasses.split(/\s+/).length;
      document.getElementById('classCountBadge').textContent = `${count} utility classes active`;

      // Update Code Pre
      const markup = `<!-- Tailwind CSS Utility Card -->\n<div class="${combinedClasses}">\n  <!-- Card Content -->\n  ...\n</div>`;
      document.getElementById('codeOutputPre').textContent = markup;
    }

    function applyPreset(type) {
      currentPreset = type;
      renderCardContent();

      if (type === 'product') {
        document.getElementById('ctrlDisplay').value = 'flex';
        document.getElementById('ctrlDirection').value = 'flex-col';
        document.getElementById('ctrlJustify').value = 'justify-between';
        document.getElementById('ctrlItems').value = 'items-center';
        document.getElementById('ctrlBg').value = 'bg-white';
        document.getElementById('ctrlTextColor').value = 'text-slate-900';
        document.getElementById('ctrlRadius').value = 'rounded-2xl';
        document.getElementById('ctrlShadow').value = 'shadow-xl';
        document.getElementById('ctrlBorderWidth').value = 'border';
        document.getElementById('ctrlBorderColor').value = 'border-slate-200';
      } else if (type === 'profile') {
        document.getElementById('ctrlDisplay').value = 'flex';
        document.getElementById('ctrlDirection').value = 'flex-col';
        document.getElementById('ctrlBg').value = 'bg-slate-900';
        document.getElementById('ctrlTextColor').value = 'text-white';
        document.getElementById('ctrlRadius').value = 'rounded-2xl';
        document.getElementById('ctrlShadow').value = 'shadow-2xl';
        document.getElementById('ctrlBorderWidth').value = 'border';
        document.getElementById('ctrlBorderColor').value = 'border-slate-700';
      } else if (type === 'toast') {
        document.getElementById('ctrlDisplay').value = 'flex';
        document.getElementById('ctrlDirection').value = 'flex-row';
        document.getElementById('ctrlBg').value = 'bg-white';
        document.getElementById('ctrlTextColor').value = 'text-slate-900';
        document.getElementById('ctrlRadius').value = 'rounded-xl';
        document.getElementById('ctrlShadow').value = 'shadow-lg';
        document.getElementById('ctrlBorderWidth').value = 'border';
        document.getElementById('ctrlBorderColor').value = 'border-slate-200';
      } else if (type === 'stats') {
        document.getElementById('ctrlDisplay').value = 'flex';
        document.getElementById('ctrlDirection').value = 'flex-col';
        document.getElementById('ctrlBg').value = 'bg-slate-900';
        document.getElementById('ctrlTextColor').value = 'text-white';
        document.getElementById('ctrlRadius').value = 'rounded-2xl';
        document.getElementById('ctrlShadow').value = 'shadow-xl';
        document.getElementById('ctrlBorderWidth').value = 'border';
        document.getElementById('ctrlBorderColor').value = 'border-slate-800';
      }

      updateLivePreview();
    }

    function resetControls() {
      applyPreset('product');
    }

    function copySnippet() {
      const code = document.getElementById('codeOutputPre').textContent;
      navigator.clipboard.writeText(code).then(() => {
        alert('Tailwind HTML snippet copied to clipboard!');
      });
    }

    window.addEventListener('DOMContentLoaded', () => {
      renderCardContent();
      updateLivePreview();
    });
  </script>
</body>
</html>
