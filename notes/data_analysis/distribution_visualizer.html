<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Normal Distribution & Z-Score Visualizer</title>
    <script src="https://cdn.plot.ly/plotly-2.32.0.min.js"></script>
    <style>
        :root {
            --primary: #2563eb;
            --bg: #f8fafc;
            --surface: #ffffff;
            --text: #1e293b;
            --border: #e2e8f0;
        }
        body {
            font-family: 'Inter', -apple-system, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        .container {
            display: flex;
            gap: 20px;
            max-width: 1200px;
            margin: 0 auto;
            width: 100%;
        }
        .controls {
            flex: 1;
            background: var(--surface);
            padding: 24px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
            border: 1px solid var(--border);
            min-width: 250px;
        }
        .visualization {
            flex: 3;
            background: var(--surface);
            padding: 24px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
            border: 1px solid var(--border);
            height: 500px;
        }
        h2 { margin-top: 0; font-size: 1.25rem; }
        .form-group { margin-bottom: 16px; }
        label { display: block; margin-bottom: 8px; font-weight: 500; font-size: 0.9rem; }
        input[type="number"], input[type="range"] {
            width: 100%;
            padding: 8px;
            border: 1px solid var(--border);
            border-radius: 6px;
            box-sizing: border-box;
        }
        .stats {
            margin-top: 24px;
            padding: 16px;
            background: #eff6ff;
            border-radius: 8px;
            border: 1px solid #bfdbfe;
        }
        .stat-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            font-size: 0.95rem;
        }
        .stat-value { font-weight: 600; color: var(--primary); }
    </style>
</head>
<body>

<div class="container">
    <div class="controls">
        <h2>Parameters</h2>
        
        <div class="form-group">
            <label>Mean (μ)</label>
            <input type="number" id="mean" value="0" step="1" oninput="updatePlot()">
        </div>
        
        <div class="form-group">
            <label>Standard Deviation (σ)</label>
            <input type="number" id="stddev" value="1" step="0.1" min="0.1" oninput="updatePlot()">
        </div>

        <div class="form-group">
            <label>Value of Interest (X)</label>
            <input type="number" id="xval" value="1.5" step="0.5" oninput="updatePlot()">
        </div>
        
        <div class="stats">
            <div class="stat-row">
                <span>Z-Score:</span>
                <span id="zscore-out" class="stat-value">1.50</span>
            </div>
            <div class="stat-row">
                <span>Formula:</span>
                <span class="stat-value">Z = (X - μ) / σ</span>
            </div>
        </div>
    </div>
    
    <div class="visualization" id="plot"></div>
</div>

<script>
    function normalPDF(x, mean, std) {
        return (1 / (std * Math.sqrt(2 * Math.PI))) * Math.exp(-0.5 * Math.pow((x - mean) / std, 2));
    }

    function updatePlot() {
        const mean = parseFloat(document.getElementById('mean').value) || 0;
        const std = parseFloat(document.getElementById('stddev').value) || 1;
        const xval = parseFloat(document.getElementById('xval').value) || 0;

        const zscore = (xval - mean) / std;
        document.getElementById('zscore-out').innerText = zscore.toFixed(2);

        // Generate curve data
        const xData = [];
        const yData = [];
        const fillX = [];
        const fillY = [];

        const range = Math.max(4 * std, 4);
        for (let x = mean - range; x <= mean + range; x += (range*2)/200) {
            xData.push(x);
            const y = normalPDF(x, mean, std);
            yData.push(y);
            
            if (x <= xval) {
                fillX.push(x);
                fillY.push(y);
            }
        }
        
        fillX.push(xval, fillX[0]);
        fillY.push(0, 0);

        const traceCurve = {
            x: xData,
            y: yData,
            mode: 'lines',
            line: { color: '#2563eb', width: 3 },
            name: 'Normal Distribution'
        };

        const traceFill = {
            x: fillX,
            y: fillY,
            fill: 'toself',
            fillcolor: 'rgba(37, 99, 235, 0.2)',
            line: { color: 'transparent' },
            name: 'Cumulative Area',
            hoverinfo: 'skip'
        };

        const traceLine = {
            x: [xval, xval],
            y: [0, normalPDF(xval, mean, std)],
            mode: 'lines',
            line: { color: '#ef4444', width: 2, dash: 'dash' },
            name: 'X Value'
        };

        const layout = {
            title: 'Normal Distribution & Z-Score',
            margin: { t: 40, b: 40, l: 40, r: 20 },
            xaxis: { title: 'Value (X)', zeroline: false },
            yaxis: { title: 'Probability Density', zeroline: false },
            showlegend: false,
            hovermode: 'x unified'
        };

        Plotly.newPlot('plot', [traceFill, traceCurve, traceLine], layout, {responsive: true, displayModeBar: false});
    }

    // Initial plot
    updatePlot();
</script>

</body>
</html>
