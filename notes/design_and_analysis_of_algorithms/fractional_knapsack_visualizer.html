<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="lumi_theme.css">
  <style>
    body { margin: 0; padding: 20px; }
    h2 { margin-top: 0; margin-bottom: 8px; }
    .widget-container { width: 100%; max-width: 900px; margin: 0 auto; display: flex; flex-direction: column; gap: var(--lumi-sys-spacing--m, 12px); }
    
    #layout { display: flex; gap: 20px; width: 100%; }
    .panel { flex: 1; display: flex; flex-direction: column; gap: 12px; }
    .panel h3 { margin-top: 0; text-align: center; font-family: var(--ff-sans); color: var(--on-surface); }
    
    .item-list { display: flex; flex-direction: column; gap: 8px; }
    .item { display: flex; justify-content: space-between; padding: 12px 16px; background: var(--surface-container, #f2f0f0); border-radius: 8px; border-left: 4px solid var(--outline, #727676); transition: 0.3s; color: var(--on-surface); font-family: var(--ff-sans); }
    .item.sorted { border-left-color: var(--primary, #3186ff); }
    .item.taken-full { background: var(--positive-container, #daf9d4); border-left-color: var(--positive, #008052); }
    .item.taken-frac { background: var(--error-container, #ffdeec); border-left-color: var(--error, #de2d29); }
    .item-title { font-weight: bold; }
    .item-stats { font-family: var(--ff-mono); font-size: 14px; color: var(--on-surface-variant, #555); }
    
    .knapsack-visual { width: 100%; height: 300px; border: 4px solid var(--outline, #555); border-top: none; border-radius: 0 0 16px 16px; position: relative; display: flex; flex-direction: column; justify-content: flex-end; overflow: hidden; background: var(--surface-dim, #fafafa);}
    .ks-block { width: 100%; background: var(--primary, #3186ff); color: var(--surface-bright, #fff); display: flex; align-items: center; justify-content: center; font-weight: bold; font-family: var(--ff-sans); border-top: 1px solid rgba(255,255,255,0.3); transition: height 0.5s; overflow: hidden; }
    .ks-block.frac { background: var(--error, #de2d29); }
    
    .status { margin-top: 0; font-size: 18px; font-weight: bold; text-align: center; color: var(--on-surface); font-family: var(--ff-sans); }
    
    .control-deck { background-color: var(--lumi-sys-color--surface-container, #f2f0f0); padding: 16px; border-radius: 16px; display: flex; flex-direction: column; gap: 16px; }
    .action-row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
    .playback-bar { display: flex; justify-content: space-between; align-items: center; border-top: 1px solid var(--stroke-default); padding-top: 12px; }
    .playback-btns { display: flex; gap: 8px; }
    #message { font-family: var(--ff-sans); font-size: 15px; color: var(--on-surface-variant); min-height: 20px; font-style: italic; }
  </style>
</head>
<body>

  <div class="widget-container">
    <div class="lumi-card" style="padding: 20px;">
      <h2 class="lumi-card-title">Fractional Knapsack Visualizer</h2>
      <p class="lumi-card-subtitle">Items are sorted by P/W ratio. The algorithm greedily takes whole items, fractioning the last one.</p>
    </div>

    <div class="lumi-card" style="padding: 20px;">
      <div class="status">
        Total Profit: <span id="profitTxt">0</span> | Remaining W: <span id="wTxt">50</span>
      </div>
      <div id="layout">
        <div class="panel">
          <h3>Available Items</h3>
          <div class="item-list" id="itemList"></div>
        </div>
        <div class="panel">
          <h3>Knapsack</h3>
          <div class="knapsack-visual" id="ksVisual"></div>
        </div>
      </div>
    </div>

    <div class="control-deck">
      <div id="message">Adjust capacity and click Start.</div>
      
      <div class="action-row">
        <input type="number" id="capacityInput" class="lumi-input" style="width: 140px; min-height: 40px;" value="50" placeholder="Capacity (W)">
        <button id="btnStart" class="lumi-btn lumi-btn--primary" onclick="startAlg()">Sort & Start</button>
      </div>

      <div class="playback-bar">
        <div style="flex: 1;"></div>
        <div class="playback-btns">
          <button id="btnStep" class="lumi-btn lumi-btn--primary" onclick="stepAlg()" disabled>Step (Take Item)</button>
          <button class="lumi-btn lumi-btn--ghost" onclick="reset()">Reset</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    const initialItems = [
      { id: "I1", p: 60, w: 10 },
      { id: "I2", p: 100, w: 20 },
      { id: "I3", p: 120, w: 30 }
    ];
    let items = [];
    let capacity = 50;
    let initialCapacity = 50;
    let profit = 0;
    let stepIndex = 0;

    function initItems() {
      // Clone and compute ratios
      items = initialItems.map(item => ({
        ...item,
        ratio: item.p / item.w,
        status: 'default' // default, sorted, taken-full, taken-frac
      }));
      renderItems();
    }

    function reset() {
      const capInput = parseInt(document.getElementById("capacityInput").value);
      if (!isNaN(capInput) && capInput > 0) {
        capacity = capInput;
        initialCapacity = capInput;
      } else {
        capacity = 50;
      }
      profit = 0;
      stepIndex = 0;
      document.getElementById("btnStart").disabled = false;
      document.getElementById("btnStep").disabled = true;
      document.getElementById("capacityInput").disabled = false;
      document.getElementById("ksVisual").innerHTML = "";
      updateStatus();
      initItems();
      document.getElementById("message").innerText = "Ready.";
    }

    function startAlg() {
      capacity = parseInt(document.getElementById("capacityInput").value) || 50;
      initialCapacity = capacity;
      document.getElementById("capacityInput").disabled = true;
      document.getElementById("btnStart").disabled = true;
      document.getElementById("btnStep").disabled = false;
      
      // Sort items by ratio descending
      items.sort((a, b) => b.ratio - a.ratio);
      items.forEach(i => i.status = 'sorted');
      
      renderItems();
      updateStatus();
      document.getElementById("message").innerText = "Items sorted by Value/Weight ratio. Click Step.";
    }

    function stepAlg() {
      if (stepIndex >= items.length || capacity <= 0) {
        document.getElementById("btnStep").disabled = true;
        document.getElementById("message").innerText = "Knapsack is full or no items left!";
        return;
      }

      let item = items[stepIndex];
      let fraction = 1.0;
      
      if (item.w <= capacity) {
        // Take full
        capacity -= item.w;
        profit += item.p;
        item.status = 'taken-full';
        addBlock(item.id, item.w, item.p, false);
        document.getElementById("message").innerText = `Took 100% of ${item.id}.`;
      } else {
        // Take fraction
        fraction = capacity / item.w;
        let fracProfit = item.p * fraction;
        profit += fracProfit;
        addBlock(item.id, capacity, fracProfit, true, fraction);
        capacity = 0;
        item.status = 'taken-frac';
        document.getElementById("message").innerText = `Took ${(fraction*100).toFixed(1)}% of ${item.id}. Knapsack full!`;
      }
      
      stepIndex++;
      renderItems();
      updateStatus();
      
      if (capacity <= 0 || stepIndex >= items.length) {
        document.getElementById("btnStep").disabled = true;
        if(capacity <= 0) {
            document.getElementById("message").innerText += " (Optimal Result)";
        }
      }
    }
    
    function addBlock(id, wUsed, pGained, isFrac, fracPercent) {
      const container = document.getElementById("ksVisual");
      const block = document.createElement("div");
      block.className = "ks-block" + (isFrac ? " frac" : "");
      
      // Calculate height percentage relative to initial capacity
      // Cap at 100% just in case
      let pct = (wUsed / initialCapacity) * 100;
      block.style.height = pct + "%";
      
      let txt = `${id} (w:${wUsed}, p:${pGained.toFixed(1)})`;
      if (isFrac) txt = `[${(fracPercent*100).toFixed(0)}%] ` + txt;
      block.innerText = txt;
      
      // Insert at top so it stacks
      container.insertBefore(block, container.firstChild);
    }

    function renderItems() {
      const list = document.getElementById("itemList");
      list.innerHTML = "";
      items.forEach(item => {
        const div = document.createElement("div");
        div.className = `item ${item.status}`;
        div.innerHTML = `
          <div class="item-title">${item.id}</div>
          <div class="item-stats">P: ${item.p} | W: ${item.w} | Ratio: ${item.ratio.toFixed(1)}</div>
        `;
        list.appendChild(div);
      });
    }

    function updateStatus() {
      document.getElementById("profitTxt").innerText = profit.toFixed(1);
      document.getElementById("wTxt").innerText = capacity;
    }

    initItems();
    
    window.addEventListener('load', () => {
       const height = document.body.scrollHeight;
       window.parent.postMessage({type: 'widget-resize', height: height + 20}, '*');
    });
  </script>
</body>
</html>
