<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <style>
    body { font-family: sans-serif; display: flex; flex-direction: column; align-items: center; background: #fdfcfc; margin: 0; padding: 20px; }
    h2 { margin-top: 0; }
    .controls { margin-bottom: 20px; display: flex; gap: 10px; }
    input { padding: 8px; font-size: 16px; border: 1px solid #ccc; border-radius: 4px; width: 80px; }
    button { padding: 8px 16px; font-size: 16px; cursor: pointer; border: none; border-radius: 4px; background: #3186ff; color: white; transition: 0.2s; }
    button:hover { background: #2565c8; }
    button:disabled { background: #ccc; cursor: not-allowed; }
    button.step-btn { background: #008052; }
    button.step-btn:hover { background: #006b44; }
    #canvas { width: 100%; max-width: 800px; height: 400px; background: white; border: 1px solid #ddd; border-radius: 8px; overflow: hidden; position: relative; }
    .node { position: absolute; width: 30px; height: 30px; border-radius: 50%; background: #9dd2ff; border: 2px solid #3186ff; display: flex; align-items: center; justify-content: center; font-weight: bold; transform: translate(-50%, -50%); z-index: 10; transition: all 0.5s ease; }
    .node.min { background: #50e389; border-color: #228a49; }
    .node.active { background: #ffdeec; border-color: #de2d29; box-shadow: 0 0 0 4px rgba(222, 45, 41, 0.3); z-index: 15; }
    .edge { position: absolute; border-top: 2px solid #3186ff; transform-origin: 0 50%; z-index: 5; transition: all 0.5s ease; }
    #message { margin-top: 15px; font-size: 16px; min-height: 24px; color: #555; font-style: italic; }
  </style>
</head>
<body>

  <h2>Binomial Heap Visualizer</h2>
  
  <div class="controls">
    <input type="number" id="valInput" placeholder="Value">
    <button id="btnInsert" onclick="insert()">Insert</button>
    <button id="btnExtract" onclick="extractMin()">Extract Min</button>
    <button id="btnStep" class="step-btn" onclick="step()" disabled>Step Consolidation</button>
    <button onclick="reset()">Reset</button>
  </div>

  <div id="canvas"></div>
  <div id="message">Heap is empty.</div>

  <script>
    let heap = []; // Array of trees (roots)
    let nextId = 0;
    
    // State machine for step logic
    let isConsolidating = false;
    let consIndex = 0;

    function reset() {
      heap = [];
      nextId = 0;
      isConsolidating = false;
      document.getElementById("btnInsert").disabled = false;
      document.getElementById("btnExtract").disabled = false;
      document.getElementById("btnStep").disabled = true;
      updateUI("Heap reset.");
    }

    function insert() {
      const input = document.getElementById("valInput");
      const val = parseInt(input.value);
      if (isNaN(val)) return;
      input.value = "";
      
      const newNode = { id: nextId++, val: val, degree: 0, children: [], active: false };
      heap.unshift(newNode); // Add B0 to start of root list
      
      startConsolidation(`Inserted ${val}. Root list now requires consolidation.`);
    }

    function extractMin() {
      if (heap.length === 0) {
        updateUI("Heap is already empty.");
        return;
      }
      if (isConsolidating) return;
      
      let minIdx = 0;
      for (let i = 1; i < heap.length; i++) {
        if (heap[i].val < heap[minIdx].val) minIdx = i;
      }
      
      const minNode = heap[minIdx];
      heap.splice(minIdx, 1);
      const children = minNode.children.reverse(); // Reverse so smaller degrees are first
      heap = heap.concat(children); // Merge root lists
      
      // Sort root list by degree
      heap.sort((a, b) => a.degree - b.degree);
      
      startConsolidation(`Extracted minimum ${minNode.val}. Appended children to root list. Begin consolidation.`);
    }
    
    function startConsolidation(msg) {
      isConsolidating = true;
      consIndex = 0;
      document.getElementById("btnInsert").disabled = true;
      document.getElementById("btnExtract").disabled = true;
      document.getElementById("btnStep").disabled = false;
      
      // Clear active states
      clearActive();
      updateUI(msg);
    }
    
    function clearActive() {
        const resetActive = (node) => {
            node.active = false;
            node.children.forEach(resetActive);
        }
        heap.forEach(resetActive);
    }

    function step() {
      if (!isConsolidating) return;
      
      clearActive();
      
      if (consIndex >= heap.length - 1) {
        // Done consolidating
        isConsolidating = false;
        document.getElementById("btnInsert").disabled = false;
        document.getElementById("btnExtract").disabled = false;
        document.getElementById("btnStep").disabled = true;
        updateUI("Consolidation complete.");
        return;
      }
      
      let node1 = heap[consIndex];
      let node2 = heap[consIndex + 1];
      
      if (node1.degree === node2.degree) {
        node1.active = true;
        node2.active = true;
        
        // Link them
        let parent, child;
        if (node1.val <= node2.val) {
          parent = node1;
          child = node2;
          heap.splice(consIndex + 1, 1);
        } else {
          parent = node2;
          child = node1;
          heap.splice(consIndex, 1);
        }
        parent.children.unshift(child); // Add as leftmost child
        parent.degree++;
        updateUI(`Linked two B${parent.degree-1} trees. ${parent.val} <= ${child.val}, so ${child.val} became a child of ${parent.val}.`);
        // Do not increment consIndex, check again in case we need another link at this position
      } else {
        node1.active = true;
        updateUI(`Degrees do not match at index ${consIndex} (B${node1.degree} vs B${node2.degree}). Moving to next pair.`);
        consIndex++;
      }
      
      render();
    }

    function updateUI(msg) {
      document.getElementById("message").innerText = msg;
      render();
    }

    function render() {
      const canvas = document.getElementById("canvas");
      canvas.innerHTML = "";
      
      if (heap.length === 0) return;

      let minNode = heap[0];
      for (const root of heap) {
        if (root.val < minNode.val) minNode = root;
      }

      // Compute layout
      let startX = 40;
      for (const root of heap) {
        const bbox = computeTreeWidth(root);
        const center = startX + bbox / 2;
        drawTree(root, center, 40, canvas, root === minNode && !isConsolidating);
        startX += bbox + 20;
      }
    }

    function computeTreeWidth(node) {
      if (node.degree === 0) return 40;
      let width = 0;
      for (const child of node.children) {
        width += computeTreeWidth(child);
      }
      return Math.max(40, width);
    }

    function drawTree(node, x, y, canvas, isMinRoot = false) {
      // Draw children
      if (node.children.length > 0) {
        let childX = x - (computeTreeWidth(node) / 2) + 20;
        const childY = y + 60;
        
        for (const child of node.children) {
          const cWidth = computeTreeWidth(child);
          const cx = childX + (cWidth / 2) - 20;
          
          // Draw edge
          const dist = Math.hypot(cx - x, childY - y);
          const angle = Math.atan2(childY - y, cx - x);
          
          const edge = document.createElement("div");
          edge.className = "edge";
          edge.style.width = dist + "px";
          edge.style.left = x + "px";
          edge.style.top = y + "px";
          edge.style.transform = `rotate(${angle}rad)`;
          canvas.appendChild(edge);
          
          drawTree(child, cx, childY, canvas);
          childX += cWidth;
        }
      }
      
      // Draw node
      const el = document.createElement("div");
      let classes = "node";
      if (isMinRoot) classes += " min";
      if (node.active) classes += " active";
      
      el.className = classes;
      el.innerText = node.val;
      el.style.left = x + "px";
      el.style.top = y + "px";
      canvas.appendChild(el);
    }
    
    // Notify parent iframe height
    window.addEventListener('load', () => {
       const height = document.body.scrollHeight;
       window.parent.postMessage({type: 'widget-resize', height: height + 20}, '*');
    });
  </script>
</body>
</html>
