<!DOCTYPE html>
<html lang="en">
<head>
<style id="lumi-runtime">
/* luminous.css */
/*
 * Luminous runtime stylesheet — injected once into every generated widget's
 * <head> by the C++ widget agent (id="lumi-runtime"). Single Source of Truth
 * for ALL design tokens and pre-baked .lumi-* component classes. The SI prompts
 * (design.md / html_generation.jinja2 / chart.jinja2) must NOT re-declare these
 * tokens or component CSS; they only reference them.
 *
 * Sections:
 *   1. Web fonts (Google Sans Flex + Google Sans Code)
 *   2. Light token :root (from previewer tokens.css, verbatim)
 *   3. Dark token overrides — REMAPPED to :root so canvas/D3 readers of
 *      getComputedStyle(document.documentElement) resolve dark values (D3).
 *   4. Short diagram/chart aliases (bridge legacy --surface / --chart-N names).
 *   5. In-scope pre-baked .lumi-* component classes.
 */

/* ============================================================
 * 1. WEB FONTS  (Google Sans Flex + Google Sans Code only)
 *    Material Symbols Outlined is intentionally NOT loaded: no in-scope
 *    .lumi-* control has a functional CSS glyph dependency on it, and the
 *    icon ban forbids decorative icons (Decision D2).
 * ============================================================ */
@import url('https://fonts.googleapis.com/css2?family=Google+Sans+Flex:ital,wght@0,300..700;1,300..700&family=Google+Sans+Code:ital,wght,MONO@0,300..700,0..1;1,300..700,0..1&display=swap');

/* ============================================================
 * 2. LIGHT TOKENS (:root)
 * ============================================================ */
:root {
  --body-bg: transparent;
  --ff-sans: 'Google Sans Flex', 'Google Sans Text', 'Google Sans', sans-serif;
  --ff-mono: 'Google Sans Code', 'Google Sans Mono', monospace;

  --lumi-sys-spacing--xxs: 2px;
  --lumi-sys-spacing--xs: 4px;
  --lumi-sys-spacing--s: 8px;
  --lumi-sys-spacing--m: 12px;
  --lumi-sys-spacing--l: 16px;
  --lumi-sys-spacing--xl: 20px;
  --lumi-sys-spacing--xxl: 24px;
  --lumi-sys-spacing--3xl: 28px;
  --lumi-sys-spacing--4xl: 36px;

  --lumi-sys-shape--none: 0px;

  --lumi-sys-shape--small: 8px;

/* ============================================================

 *    MUST live on :root (not scoped to body) to prevent black-chart regressions.
 * ============================================================ */
:root[data-theme="dark"],

  --lumi-sys-color--positive: #0ebc5f;

  --lumi-sys-color--accent: #1f3b9b;

  --lumi-sys-color--code-background: #141414;

/* ============================================================
 * 3b. OS-LEVEL DARK FALLBACK  (prefers-color-scheme)
 *     A prior refactor introduced this stylesheet and moved the dark tokens onto
 *     :root[data-theme="dark"], but dropped the @media (prefers-color-scheme:
 *     dark) trigger that widgets previously carried in their own <style>.
 *     Inline widgets whose host sends no set-theme / data-theme message therefore
 *     stayed on the light --surface (#fdfcfc), rendering white in dark mode.
 *     Re-apply the dark values on OS dark; an explicit host data-theme="light"
 *     still opts back to light. Keep in sync with the :root[data-theme="dark"]
 *     block above.
 * ============================================================ */
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --body-bg: #0f0f0f;
    --lumi-sys-elevation--level1: 0 0 20px 0 rgba(0, 0, 0, 0.28);
    --lumi-sys-elevation--level2: 0 0 20px 0 rgba(0, 0, 0, 0.40);

    --lumi-sys-color--surface: #0f0f0f;
    --lumi-sys-color--surface-dim: #141414;
    --lumi-sys-color--surface-bright: #1c1c1c;
    --lumi-sys-color--surface-background: #0f0f0f;
    --lumi-sys-color--surface-accent: #14204f;
    --lumi-sys-color--surface-container: #141414;
    --lumi-sys-color--surface-container-high: #1c1c1c;
    --lumi-sys-color--on-surface: #e0e0e0;
    --lumi-sys-color--on-surface-default: #e0e0e0;
    --lumi-sys-color--on-surface-variant: rgba(255, 255, 255, 0.55);
    --lumi-sys-color--on-surface-de-emphasis: rgba(255, 255, 255, 0.55);
    --lumi-sys-color--on-surface-low: rgba(255, 255, 255, 0.12);
    --lumi-sys-color--positive: #0ebc5f;
    --lumi-sys-color--positive-container: #002220;
    --lumi-sys-color--on-positive-container: #0ebc5f;
    --lumi-sys-color--error: #ff4c45;
    --lumi-sys-color--error-container: #3c0202;
    --lumi-sys-color--on-error-container: #ff4c45;
    --lumi-sys-color--accent: #1f3b9b;
    --lumi-sys-color--accent-container: #192967;
    --lumi-sys-color--accent-fixed: #3186ff;
    --lumi-sys-color--primary: #9dd2ff;
    --lumi-sys-color--on-primary: #192967;
    --lumi-sys-color--black: #000000;
    --lumi-sys-color--white: #ffffff;
    --lumi-sys-color--outline: #9a9b9c;
    --lumi-sys-color--stroke-default: #2d2f38;

    --lumi-sys-color--code-background: #141414;
    --lumi-sys-color--code-primary-text: #ffffff;
    --lumi-sys-color--code-blue-text: #4fa0ff;
    --lumi-sys-color--code-green-text: #60d673;
    --lumi-sys-color--code-grey-text: #808080;
    --lumi-sys-color--code-pink-text: #ff96da;
    --lumi-sys-color--code-purple-text: #969dff;
    --lumi-sys-color--code-red-text: #ff5a59;
    --lumi-sys-color--code-yellow-text: #ffdb0f;

    --lumi-sys-color--chart-series-1: #9dd2ff;
    --lumi-sys-color--chart-series-2: #96a7d6;
    --lumi-sys-color--chart-series-3: #50e389;
    --lumi-sys-color--chart-series-4: #c8f585;
    --lumi-sys-color--chart-series-5: #f5f2e6;
    --lumi-sys-color--chart-series-6: #dcd8c0;
    --lumi-sys-color--chart-series-7: #82c7ff;
    --lumi-sys-color--chart-series-8: #f5d77f;
    --lumi-sys-color--chart-series-9: #d9ceff;

/* ============================================================
 * 4. SHORT DIAGRAM / CHART ALIASES
 *    Legacy diagram.md and chart.jinja2 reference short names such as
 *    --surface, --on-surface, --chart-1..10, --primary, --r-full. These MUST
 *    resolve to the canonical --lumi-sys-color--* tokens (which flip in dark
 *    mode) — otherwise every diagram var() falls back to black (historical
 *    mass-regression bug #4). Light-hex fallbacks are a last resort only.
 * ============================================================ */
:root {
  /* surfaces */
  --surface: var(--lumi-sys-color--surface, #fdfcfc);
  --surface-dim: var(--lumi-sys-color--surface-dim, #f2f0f0);
  --surface-bright: var(--lumi-sys-color--surface-bright, #ffffff);
  --surface-container: var(--lumi-sys-color--surface-container, #f2f0f0);
  --surface-container-high: var(--lumi-sys-color--surface-container-high, #e6e6e6);
  --surface-container-lowest: var(--lumi-sys-color--surface, #ffffff);
  --surface-accent: var(--lumi-sys-color--surface-accent, #9dd2ff);
  /* foreground */
  --on-surface: var(--lumi-sys-color--on-surface, #000000);
  --on-surface-variant: var(--lumi-sys-color--on-surface-variant, rgba(0, 0, 0, 0.55));
  --on-surface-low: var(--lumi-sys-color--on-surface-low, rgba(0, 0, 0, 0.08));
  /* accents / brand */
  --primary: var(--lumi-sys-color--primary, #3186ff);
  --primary-container: var(--lumi-sys-color--accent-container, #dcf1ff);
  --accent: var(--lumi-sys-color--accent, #9dd2ff);
  --accent-container: var(--lumi-sys-color--accent-container, #dcf1ff);
  --accent-fixed: var(--lumi-sys-color--accent-fixed, #3186ff);
  /* status */
  --positive: var(--lumi-sys-color--positive, #008052);
  --positive-container: var(--lumi-sys-color--positive-container, #daf9d4);
  --error: var(--lumi-sys-color--error, #de2d29);
  --error-container: var(--lumi-sys-color--error-container, #ffdeec);
  /* structure */
  --outline: var(--lumi-sys-color--outline, #727676);
  --stroke-default: var(--lumi-sys-color--stroke-default, #e3e3e3);
  /* chart series 1..10 */
  --chart-1: var(--lumi-sys-color--chart-series-1, #2575fc);
  --chart-2: var(--lumi-sys-color--chart-series-2, #5b6e9e);
  --chart-3: var(--lumi-sys-color--chart-series-3, #228a49);
  --chart-4: var(--lumi-sys-color--chart-series-4, #62991b);
  --chart-5: var(--lumi-sys-color--chart-series-5, #1e564d);
  --chart-6: var(--lumi-sys-color--chart-series-6, #526a45);
  --chart-7: var(--lumi-sys-color--chart-series-7, #2780c4);
  --chart-8: var(--lumi-sys-color--chart-series-8, #997112);
  --chart-9: var(--lumi-sys-color--chart-series-9, #705ec2);
  --chart-10: var(--lumi-sys-color--chart-series-10, #c84288);
  /* code palette */
  --code-background: var(--lumi-sys-color--code-background, #000000);
  --code-primary-text: var(--lumi-sys-color--code-primary-text, #ffffff);
  /* spacing shorthands */
  --spacing-xs: var(--lumi-sys-spacing--xs, 4px);
  --spacing-s: var(--lumi-sys-spacing--s, 8px);
  --spacing-m: var(--lumi-sys-spacing--m, 12px);
  --spacing-l: var(--lumi-sys-spacing--l, 16px);
  --spacing-xl: var(--lumi-sys-spacing--xl, 20px);
  /* radius shorthands */
  --r-s: var(--lumi-sys-shape--small, 8px);
  --r-m: var(--lumi-sys-shape--medium, 12px);
  --r-l: var(--lumi-sys-shape--large, 16px);
  --r-full: var(--lumi-sys-shape--full, 999px);
}

/* ============================================================
 * 5. IN-SCOPE PRE-BAKED COMPONENT CLASSES
 *    Interactive controls + simple display components only (Decision D5).
 *    Complex components (timeline, sequence, stepper, pros-cons, hero, HUD,
 *    hotspot, media grid) are intentionally excluded.
 * ============================================================ */

/* Global font rendering quality + themed surface backdrop.
 * background/color MUST be set here (SSoT) so the widget backdrop follows the
 * light/dark surface token deterministically. Without this, a widget whose
 * model-generated markup forgets `background: var(--surface)` on its root
 * container falls back to the browser-default white body, producing a broken
 * dark mode (light header/chart area behind a dark card). Regression source:
 * batch1 PB-A02 dark. */
html, body {
  background: var(--body-bg, transparent) !important;
  color: var(--on-surface) !important;
  /* Auto-resizing iframe: content grows the frame, never scrolls the document.
   * Model widgets already emit this; declared here as the SSoT default. */
  overflow-y: hidden;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  font-optical-sizing: auto;
  text-rendering: optimizeLegibility;
}

/* ============================================================
 * SCROLLBAR DISCIPLINE (single source of truth)
 *   Long lists/cards flow and let the iframe auto-resize (see the C++
 *   NeutralizeInnerScroll pass, which removes accidental tiny scroll boxes).
 *   For LEGITIMATE overflow that remains (wide tables, code, pan-containers,
 *   large >=240px viewports) render a slim, theme-aware scrollbar.
 *   One token carries the correct light/dark contrast (the auto-flipped
 *   stroke token is too dark on #0f0f0f), referenced once = SSoT.
 * ============================================================ */
:root { --lumi-scrollbar-thumb: rgba(0, 0, 0, 0.20); }
:root[data-theme="dark"], body.dark-mode { --lumi-scrollbar-thumb: rgba(255, 255, 255, 0.20); }
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --lumi-scrollbar-thumb: rgba(255, 255, 255, 0.20); }
}
* {
  scrollbar-width: thin;
  scrollbar-color: var(--lumi-scrollbar-thumb) transparent;
}
::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb {
  background-color: var(--lumi-scrollbar-thumb);
  border-radius: var(--lumi-sys-shape--full, 999px);
}

/* --- Buttons --- */
.lumi-btn { display: inline-flex; align-items: center; justify-content: center; gap: var(--lumi-sys-spacing--s, 8px); min-height: 48px; padding: 0px 24px; font-family: var(--ff-sans, 'Google Sans Flex', 'Google Sans', sans-serif); font-size: 15px; font-weight: 400; line-height: 20px; border-radius: var(--lumi-sys-shape--full, 999px); border-width: medium; border-style: none; border-color: currentcolor; border-image: none; cursor: pointer; user-select: none; transition: background-color 0.15s, color 0.15s, border-color 0.15s, box-shadow 0.15s, transform 0.1s; text-decoration: none; box-sizing: border-box; white-space: nowrap; }
.lumi-btn:active, .lumi-btn.is-pressed { transform: scale(0.98); }
.lumi-btn--accent, .lumi-btn--primary { background-color: var(--lumi-sys-color--accent, #9dd2ff); color: var(--lumi-sys-color--on-surface-default, #000000); }
.lumi-btn--accent:hover, .lumi-btn--primary:hover { background-color: var(--lumi-sys-color--accent-container, #dcf1ff); }
.lumi-btn--tonal { background-color: var(--lumi-sys-color--surface-dim, #f2f0f0); color: var(--lumi-sys-color--on-surface-default, #000000); }
.lumi-btn--tonal:hover { background-color: var(--lumi-sys-color--surface-bright, #ffffff); }
.lumi-btn--bright { background-color: var(--lumi-sys-color--surface-bright, #ffffff); color: var(--lumi-sys-color--on-surface-default, #000000); border-width: medium; border-style: none; border-color: currentcolor; border-image: none; box-shadow: none; }
.lumi-btn--bright:hover { background-color: var(--lumi-sys-color--surface-dim, #f2f0f0); }
.lumi-btn--ghost, .lumi-btn--on-surface { background-color: var(--lumi-sys-color--on-surface-low, rgba(0, 0, 0, 0.04)); color: var(--lumi-sys-color--on-surface-default, #000000); }
.lumi-btn--ghost:hover, .lumi-btn--on-surface:hover { background-color: var(--lumi-sys-color--on-surface-low, rgba(0, 0, 0, 0.08)); }
.lumi-btn--translucent { background-color: rgba(255, 255, 255, 0.25); backdrop-filter: blur(12px); color: var(--lumi-sys-color--on-surface-default, #000000); border-color: rgba(255, 255, 255, 0.3); }
.lumi-btn--translucent:hover { background-color: rgba(255, 255, 255, 0.35); }
.lumi-btn--small { min-height: 36px; padding: 0px 16px; font-size: 13px; line-height: 18px; gap: var(--lumi-sys-spacing--xs, 4px); }
.lumi-btn--xsmall { min-height: 24px; padding: 0px 10px; font-size: 11px; line-height: 16px; gap: 4px; }
.lumi-btn:disabled, .lumi-btn.is-disabled { opacity: var(--lumi-sys-opacity-state--disabled, 0.38); cursor: not-allowed; pointer-events: none; }
.lumi-btn.is-selected, .lumi-btn.selected, .lumi-btn[aria-pressed="true"] { background-color: var(--lumi-sys-color--accent-container, #dcf1ff); color: var(--lumi-sys-color--on-surface-default, #000000); }
.lumi-btn.is-selected:hover, .lumi-btn.selected:hover, .lumi-btn[aria-pressed="true"]:hover { background-color: var(--lumi-sys-color--accent, #9dd2ff); }

/* --- Switch --- */

        <button id="btnInsert" class="btn btn-primary">Insert</button>
        <button id="btnSearch" class="btn btn-tonal">Search</button>
        <button id="btnDelete" class="btn btn-tonal">Delete</button>
      </div>

      <div class="playback-bar">
        <div class="legend-row">
          <div class="legend-item">
            <span class="legend-dot red"></span>
            <span>Red Node</span>
          </div>
          <div class="legend-item">
            <span class="legend-dot black"></span>
            <span>Black Node</span>
          </div>
        </div>

        <div class="playback-btns">
          <button id="btnPrev" class="btn btn-tonal btn-small" disabled>Prev</button>
          <button id="btnPlay" class="btn btn-tonal btn-small" disabled>Auto Play</button>
          <button id="btnNext" class="btn btn-tonal btn-small" disabled>Next</button>
          <button id="btnReset" class="btn btn-tonal btn-small">Reset</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    // --- RED-BLACK TREE IMPLEMENTATION WITH STEP RECORDING ---
    const RED = 'RED';
    const BLACK = 'BLACK';

    class Node {
      constructor(val, color = RED) {
        this.val = val;
        this.color = color;
        this.left = null;
        this.right = null;
        this.parent = null;
        this.id = 'node_' + val + '_' + Math.random().toString(36).substr(2, 5);
      }
    }

    class RedBlackTree {
      constructor() {
        this.NIL = new Node(null, BLACK);
        this.root = this.NIL;
      }

      // Clone tree structure for snapshot
      cloneTree(node = this.root, parentMap = new Map()) {
        if (node === this.NIL || !node) return null;
        const copy = {
          id: node.id,
          val: node.val,
          color: node.color,
          left: this.cloneTree(node.left, parentMap),
          right: this.cloneTree(node.right, parentMap)
        };
        return copy;
      }
    }

    // Initialize default tree (20 Black, 10 Red, 30 Red)
    function createInitialTree() {
      const tree = new RedBlackTree();
      
      const root = new Node(20, BLACK);
      const left = new Node(10, RED);
      const right = new Node(30, RED);

      tree.root = root;
      root.parent = tree.NIL;

      root.left = left;
      left.parent = root;
      left.left = tree.NIL;
      left.right = tree.NIL;

      root.right = right;
      right.parent = root;
      right.left = tree.NIL;
      right.right = tree.NIL;

      return tree;
    }

    let rbTree = createInitialTree();
    let steps = [];
    let currentStepIdx = 0;
    let playInterval = null;

    // Record snapshot helper
    function recordStep(tree, message, highlightNodes = [], highlightEdges = [], foundNode = null) {
      steps.push({
        treeSnap: tree.cloneTree(),
        message: message,
        highlightNodes: [...highlightNodes],
        highlightEdges: [...highlightEdges],
        foundNode: foundNode
      });
    }

    // --- SEARCH ALGORITHM WITH STEPS ---
    function searchSteps(val) {
      steps = [];
      recordStep(rbTree, `Starting search for value ${val}...`);
      
      let curr = rbTree.root;
      let path = [];

      while (curr && curr !== rbTree.NIL) {
        path.push(curr.id);
        if (val === curr.val) {
          recordStep(rbTree, `Found node with value ${val}!`, path, [], curr.id);
          return;
        } else if (val < curr.val) {
          recordStep(rbTree, `${val} < ${curr.val}: Moving left child.`, path, curr.left !== rbTree.NIL ? [`${curr.id}-${curr.left.id}`] : []);
          curr = curr.left;
        } else {
          recordStep(rbTree, `${val} > ${curr.val}: Moving right child.`, path, curr.right !== rbTree.NIL ? [`${curr.id}-${curr.right.id}`] : []);
          curr = curr.right;
        }
      }

      recordStep(rbTree, `Value ${val} not found in tree.`, path);
    }

    // --- INSERTION ALGORITHM WITH STEPS ---
    function insertSteps(val) {
      steps = [];
      const tree = rbTree;
      const newNode = new Node(val, RED);
      newNode.left = tree.NIL;
      newNode.right = tree.NIL;

      recordStep(tree, `Starting insertion of ${val}...`);

      let y = tree.NIL;
      let x = tree.root;
      let path = [];

      while (x !== tree.NIL) {
        y = x;
        path.push(x.id);
        if (newNode.val < x.val) {
          recordStep(tree, `${newNode.val} < ${x.val}: Traversing left.`, path);
          x = x.left;
        } else if (newNode.val > x.val) {
          recordStep(tree, `${newNode.val} > ${x.val}: Traversing right.`, path);
          x = x.right;
        } else {
          recordStep(tree, `Value ${val} already exists in tree.`, [x.id], [], x.id);
          return;
        }
      }

      newNode.parent = y;
      if (y === tree.NIL) {
        tree.root = newNode;
      } else if (newNode.val < y.val) {
        y.left = newNode;
      } else {
        y.right = newNode;
      }

      recordStep(tree, `Inserted ${val} as RED node.`, [newNode.id]);

      // Fixup
      insertFixupSteps(tree, newNode);
    }

    function rotateLeft(tree, x) {
      let y = x.right;
      x.right = y.left;
      if (y.left !== tree.NIL) y.left.parent = x;
      y.parent = x.parent;
      if (x.parent === tree.NIL) tree.root = y;
      else if (x === x.parent.left) x.parent.left = y;
      else x.parent.right = y;
      y.left = x;
      x.parent = y;
    }

    function rotateRight(tree, x) {
      let y = x.left;
      x.left = y.right;
      if (y.right !== tree.NIL) y.right.parent = x;
      y.parent = x.parent;
      if (x.parent === tree.NIL) tree.root = y;
      else if (x === x.parent.right) x.parent.right = y;
      else x.parent.left = y;
      y.right = x;
      x.parent = y;
    }

    function insertFixupSteps(tree, z) {
      while (z.parent.color === RED) {
        if (z.parent === z.parent.parent.left) {
          let y = z.parent.parent.right; // Uncle
          if (y.color === RED) {
            recordStep(tree, `Violation: Parent (${z.parent.val}) & Uncle (${y.val}) are RED. Color flip!`, [z.id, z.parent.id, y.id]);
            z.parent.color = BLACK;
            y.color = BLACK;
            z.parent.parent.color = RED;
            z = z.parent.parent;
            recordStep(tree, `Recolored parent & uncle to BLACK, grandparent to RED.`, [z.id]);
          } else {
            if (z === z.parent.right) {
              z = z.parent;
              recordStep(tree, `Triangle case: Left rotation around ${z.val}.`, [z.id]);
              rotateLeft(tree, z);
              recordStep(tree, `Completed Left Rotation.`, [z.id]);
            }
            recordStep(tree, `Line case: Recolor parent to BLACK, grandparent to RED & Right Rotate ${z.parent.parent.val}.`, [z.parent.id, z.parent.parent.id]);
            z.parent.color = BLACK;
            z.parent.parent.color = RED;
            rotateRight(tree, z.parent.parent);
            recordStep(tree, `Completed Right Rotation.`, [z.parent.id]);
          }
        } else {
          let y = z.parent.parent.left; // Uncle
          if (y.color === RED) {
            recordStep(tree, `Violation: Parent (${z.parent.val}) & Uncle (${y.val}) are RED. Color flip!`, [z.id, z.parent.id, y.id]);
            z.parent.color = BLACK;
            y.color = BLACK;
            z.parent.parent.color = RED;
            z = z.parent.parent;
            recordStep(tree, `Recolored parent & uncle to BLACK, grandparent to RED.`, [z.id]);
          } else {
            if (z === z.parent.left) {
              z = z.parent;
              recordStep(tree, `Triangle case: Right rotation around ${z.val}.`, [z.id]);
              rotateRight(tree, z);
              recordStep(tree, `Completed Right Rotation.`, [z.id]);
            }
            recordStep(tree, `Line case: Recolor parent to BLACK, grandparent to RED & Left Rotate ${z.parent.parent.val}.`, [z.parent.id, z.parent.parent.id]);
            z.parent.color = BLACK;
            z.parent.parent.color = RED;
            rotateLeft(tree, z.parent.parent);
            recordStep(tree, `Completed Left Rotation.`, [z.parent.id]);
          }
        }
      }
      if (tree.root.color !== BLACK) {
        tree.root.color = BLACK;
        recordStep(tree, `Root forced to BLACK per Red-Black properties.`, [tree.root.id]);
      } else {
        recordStep(tree, `Tree properties restored successfully!`, [tree.root.id]);
      }
    }

    // --- DELETION ALGORITHM WITH STEPS ---
    function deleteSteps(val) {
      steps = [];
      const tree = rbTree;
      recordStep(tree, `Searching for node ${val} to delete...`);

      let z = tree.root;
      let path = [];
      while (z !== tree.NIL && z.val !== val) {
        path.push(z.id);
        if (val < z.val) z = z.left;
        else z = z.right;
      }

      if (z === tree.NIL) {
        recordStep(tree, `Node ${val} not found in tree. Nothing deleted.`, path);
        return;
      }

      recordStep(tree, `Found node ${val}. Proceeding with deletion.`, [z.id]);

      let y = z;
      let yOriginalColor = y.color;
      let x;

      if (z.left === tree.NIL) {
        x = z.right;
        rbTransplant(tree, z, z.right);
      } else if (z.right === tree.NIL) {
        x = z.left;
        rbTransplant(tree, z, z.left);
      } else {
        y = treeMinimum(tree, z.right);
        yOriginalColor = y.color;
        x = y.right;
        if (y.parent === z) {
          x.parent = y;
        } else {
          rbTransplant(tree, y, y.right);
          y.right = z.right;
          y.right.parent = y;
        }
        rbTransplant(tree, z, y);
        y.left = z.left;
        y.left.parent = y;
        y.color = z.color;
      }

      recordStep(tree, `Node ${val} removed from structure.`, []);

      if (yOriginalColor === BLACK) {
        recordStep(tree, `Deleted node was BLACK. Fixing Red-Black balance...`, []);
        deleteFixupSteps(tree, x);
      } else {
        recordStep(tree, `Deleted node was RED. No rebalancing required!`, []);
      }
    }

    function treeMinimum(tree, x) {
      while (x.left !== tree.NIL) x = x.left;
      return x;
    }

    function rbTransplant(tree, u, v) {
      if (u.parent === tree.NIL) tree.root = v;
      else if (u === u.parent.left) u.parent.left = v;
      else u.parent.right = v;
      v.parent = u.parent;
    }

    function deleteFixupSteps(tree, x) {
      while (x !== tree.root && x.color === BLACK) {
        if (x === x.parent.left) {
          let w = x.parent.right;
          if (w.color === RED) {
            w.color = BLACK;
            x.parent.color = RED;
            rotateLeft(tree, x.parent);
            w = x.parent.right;
          }
          if (w.left.color === BLACK && w.right.color === BLACK) {
            w.color = RED;
            x = x.parent;
          } else {
            if (w.right.color === BLACK) {
              w.left.color = BLACK;
              w.color = RED;
              rotateRight(tree, w);
              w = x.parent.right;
            }
            w.color = x.parent.color;
            x.parent.color = BLACK;
            w.right.color = BLACK;
            rotateLeft(tree, x.parent);
            x = tree.root;
          }
        } else {
          let w = x.parent.left;
          if (w.color === RED) {
            w.color = BLACK;
            x.parent.color = RED;
            rotateRight(tree, x.parent);
            w = x.parent.left;
          }
          if (w.right.color === BLACK && w.left.color === BLACK) {
            w.color = RED;
            x = x.parent;
          } else {
            if (w.left.color === BLACK) {
              w.right.color = BLACK;
              w.color = RED;
              rotateLeft(tree, w);
              w = x.parent.left;
            }
            w.color = x.parent.color;
            x.parent.color = BLACK;
            w.left.color = BLACK;
            rotateRight(tree, x.parent);
            x = tree.root;
          }
        }
      }
      x.color = BLACK;
      recordStep(tree, `Tree rebalanced after deletion.`, [tree.root.id]);
    }

    // --- SVG LAYOUT & RENDERING ENGINE ---
    function computeLayout(treeRoot) {
      if (!treeRoot) return { nodes: [], edges: [] };

      const nodes = [];
      const edges = [];

      function traverse(node, x, y, level, dx) {
        if (!node) return;

        nodes.push({
          id: node.id,
          val: node.val,
          color: node.color,
          x: x,
          y: y
        });

        const nextY = y + 60;
        const nextDx = Math.max(dx / 2, 24);

        if (node.left) {
          const childX = x - dx;
          edges.push({
            id: `${node.id}-${node.left.id}`,
            x1: x, y1: y,
            x2: childX, y2: nextY
          });
          traverse(node.left, childX, nextY, level + 1, nextDx);
        }

        if (node.right) {
          const childX = x + dx;
          edges.push({
            id: `${node.id}-${node.right.id}`,
            x1: x, y1: y,
            x2: childX, y2: nextY
          });
          traverse(node.right, childX, nextY, level + 1, nextDx);
        }
      }

      traverse(treeRoot, 290, 45, 0, 120);
      return { nodes, edges };
    }

    function renderStep(stepIdx) {
      if (!steps || steps.length === 0) return;

      currentStepIdx = Math.max(0, Math.min(stepIdx, steps.length - 1));
      const step = steps[currentStepIdx];

      // Update UI banner & buttons
      document.getElementById('stepText').textContent = step.message;
      document.getElementById('stepBadge').textContent = `Step ${currentStepIdx + 1} / ${steps.length}`;

      document.getElementById('btnPrev').disabled = currentStepIdx === 0;
      document.getElementById('btnNext').disabled = currentStepIdx === steps.length - 1;
      document.getElementById('btnPlay').disabled = steps.length <= 1;

      if (currentStepIdx === steps.length - 1 && playInterval) {
        stopAutoPlay();
      }

      // Compute visual positions
      const { nodes, edges } = computeLayout(step.treeSnap);

      const edgesGroup = document.getElementById('edgesGroup');
      const nodesGroup = document.getElementById('nodesGroup');

      // 1. Render Edges
      let edgesHtml = '';
      edges.forEach(e => {
        const isHighlighted = step.highlightEdges.includes(e.id);
        edgesHtml += `<line class="tree-edge ${isHighlighted ? 'highlighted' : ''}" 
          x1="${e.x1}" y1="${e.y1}" x2="${e.x2}" y2="${e.y2}" />`;
      });
      if (edgesGroup) edgesGroup.innerHTML = edgesHtml;

      // 2. Render Nodes
      let nodesHtml = '';
      nodes.forEach(n => {
        const isHighlighted = step.highlightNodes.includes(n.id);
        const isTarget = step.foundNode === n.id;
        const colorClass = n.color === RED ? 'red' : 'black';

        nodesHtml += `
          <g class="node-group" style="transform: translate(${n.x}px, ${n.y}px);">
            <circle class="node-circle ${colorClass} ${isHighlighted ? 'highlighted' : ''} ${isTarget ? 'target-found' : ''}" />
            <text class="node-text ${colorClass} ${isTarget ? 'target-found' : ''}">${n.val}</text>
          </g>
        `;
      });
      if (nodesGroup) nodesGroup.innerHTML = nodesHtml;
    }

    // --- PLAYBACK CONTROL FUNCTIONS ---
    function startAutoPlay() {
      if (playInterval) return;
      document.getElementById('btnPlay').textContent = 'Pause';
      playInterval = setInterval(() => {
        if (currentStepIdx < steps.length - 1) {
          renderStep(currentStepIdx + 1);
        } else {
          stopAutoPlay();
        }
      }, 900);
    }

    function stopAutoPlay() {
      if (playInterval) {
        clearInterval(playInterval);
        playInterval = null;
      }
      document.getElementById('btnPlay').textContent = 'Auto Play';
    }

    function toggleAutoPlay() {
      if (playInterval) stopAutoPlay();
      else startAutoPlay();
    }

    // --- EVENT LISTENERS ---
    document.getElementById('btnInsert').addEventListener('click', () => {
      stopAutoPlay();
      const val = parseInt(document.getElementById('valInput').value, 10);
      if (isNaN(val)) return;
      insertSteps(val);
      renderStep(0);
      startAutoPlay();
    });

    document.getElementById('btnSearch').addEventListener('click', () => {
      stopAutoPlay();
      const val = parseInt(document.getElementById('valInput').value, 10);
      if (isNaN(val)) return;
      searchSteps(val);
      renderStep(0);
      startAutoPlay();
    });

    document.getElementById('btnDelete').addEventListener('click', () => {
      stopAutoPlay();
      const val = parseInt(document.getElementById('valInput').value, 10);
      if (isNaN(val)) return;
      deleteSteps(val);
      renderStep(0);
      startAutoPlay();
    });

    document.getElementById('btnPrev').addEventListener('click', () => {
      stopAutoPlay();
      renderStep(currentStepIdx - 1);
    });

    document.getElementById('btnNext').addEventListener('click', () => {
      stopAutoPlay();
      renderStep(currentStepIdx + 1);
    });

    document.getElementById('btnPlay').addEventListener('click', () => {
      toggleAutoPlay();
    });

    document.getElementById('btnReset').addEventListener('click', () => {
      stopAutoPlay();
      rbTree = createInitialTree();
      steps = [];
      recordStep(rbTree, 'Reset tree to initial state (Root: 20 Black, Left: 10 Red, Right: 30 Red).');
      renderStep(0);
    });

    // Initial render
    recordStep(rbTree, 'Initial Red-Black Tree state.');
    renderStep(0);

    // Auto resize message handling
    window.addEventListener('message', e => {
      if (e.data && (e.data.type === 'set-theme' || e.data.type === 'APPLY_THEME')) {
        document.documentElement.setAttribute('data-theme', e.data.theme);
        renderStep(currentStepIdx);
      }
    });

    (function autoResize() {
      function notifyHeight() {
        const c = document.querySelector('.widget-container') || document.body;
        if (!c) return;
        const h = Math.ceil(Math.max(c.getBoundingClientRect().bottom, c.scrollHeight));
        window.parent.postMessage({type: 'widget-resize', height: h}, '*');
      }
      window.addEventListener('load', () => setTimeout(notifyHeight, 120));
      new ResizeObserver(() => notifyHeight()).observe(document.querySelector('.widget-container') || document.body);
    })();
  </script>
