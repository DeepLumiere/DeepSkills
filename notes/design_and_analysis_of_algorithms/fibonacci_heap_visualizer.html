<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="lumi_theme.css">
  <style>
    body { margin: 0; padding: 20px; }
    h2 { margin-top: 0; margin-bottom: 8px; }
    .widget-container { width: 100%; max-width: 900px; margin: 0 auto; display: flex; flex-direction: column; gap: var(--lumi-sys-spacing--m, 12px); }
    #canvas { width: 100%; height: 350px; background: transparent; position: relative; margin-top: 10px; }
    .node { position: absolute; width: 30px; height: 30px; border-radius: 50%; background: var(--surface-bright, #fff); border: 2px solid var(--primary, #3186ff); display: flex; align-items: center; justify-content: center; font-weight: bold; transform: translate(-50%, -50%); z-index: 10; transition: all 0.5s ease; color: var(--on-surface); }
    .node.min { background: var(--positive-container, #daf9d4); border-color: var(--positive, #008052); }
    .node.marked { background: var(--surface-accent, #9dd2ff); border-color: var(--outline, #727676); }
    .node.active { background: var(--error-container, #ffdeec); border-color: var(--error, #de2d29); box-shadow: 0 0 0 4px rgba(222, 45, 41, 0.3); z-index: 15; }
    .node.in-array { background: var(--surface-dim, #f2f0f0); border-style: dashed; }
    .edge { position: absolute; border-top: 2px solid var(--stroke-default, #e3e3e3); transform-origin: 0 50%; z-index: 5; transition: all 0.5s ease; }
    .root-edge { border-top: 2px dashed var(--stroke-default, #e3e3e3); }
    
    .circular-link { position: absolute; border: 2px dashed var(--stroke-default, #e3e3e3); border-top: none; z-index: 4; border-radius: 0 0 20px 20px; transition: all 0.5s ease; pointer-events: none;}
    
    .degree-array-container { display: flex; gap: 4px; margin-top: 10px; height: 40px; display: none; padding: 0 20px;}
    .array-slot { width: 40px; height: 40px; border: 1px solid var(--stroke-default, #e3e3e3); display: flex; flex-direction: column; align-items: center; background: var(--surface-dim, #f2f0f0); border-radius: 4px;}
    .array-label { font-family: var(--ff-sans); font-size: 10px; color: var(--on-surface-variant); margin-top: 2px;}
    .array-val { font-family: var(--ff-mono); color: var(--on-surface); font-weight: bold; margin-top: 2px;}
    
    .control-deck { background-color: var(--lumi-sys-color--surface-container, #f2f0f0); padding: 16px; border-radius: 16px; display: flex; flex-direction: column; gap: 16px; }
    .action-row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
    .playback-bar { display: flex; justify-content: space-between; align-items: center; border-top: 1px solid var(--stroke-default); padding-top: 12px; }
    .playback-btns { display: flex; gap: 8px; }
    #message { font-family: var(--ff-sans); font-size: 15px; color: var(--on-surface-variant); min-height: 20px; font-style: italic; }
  </style>
</head>
<body>

  <div class="widget-container">
    <div class="lumi-card" style="padding: 20px;">
      <h2 class="lumi-card-title">Fibonacci Heap Visualizer</h2>
      <p class="lumi-card-subtitle">Insert lazily into the root list, then Extract Min to consolidate.</p>
    </div>

    <div class="lumi-card" style="padding: 0; overflow: hidden;">
      <div class="degree-array-container" id="degreeArrayCont">
        <!-- max degree slots generated here -->
      </div>
      <div id="canvas"></div>
    </div>

    <div class="control-deck">
      <div id="message">Ready. Heap is empty. Lazy insertions supported.</div>
      
      <div class="action-row">
        <input type="number" id="valInput" class="lumi-input" style="width: 140px; min-height: 40px;" placeholder="Value">
        <button id="btnInsert" class="lumi-btn lumi-btn--primary" onclick="insert()">Insert</button>
        <button id="btnExtract" class="lumi-btn lumi-btn--tonal" onclick="extractMin()">Extract Min</button>
      </div>

      <div class="playback-bar">
        <div style="flex: 1;"></div>
        <div class="playback-btns">
          <button id="btnStep" class="lumi-btn lumi-btn--primary" onclick="step()" disabled>Step Consolidation</button>
          <button class="lumi-btn lumi-btn--ghost" onclick="reset()">Reset</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    let rootList = []; 
    let minNode = null;
    let nextId = 0;
    
    const MAX_DEGREE = 8;
    
    // State machine
    let isConsolidating = false;
    let pendingRoots = [];
    let A = [];
    let currentX = null;

    function initUI() {
      const cont = document.getElementById("degreeArrayCont");
      cont.innerHTML = "";
      for (let i = 0; i < MAX_DEGREE; i++) {
        cont.innerHTML += `<div class="array-slot" id="slot-${i}"><div class="array-label">A[${i}]</div><div class="array-val" id="val-${i}"></div></div>`;
      }
    }

    function reset() {
      rootList = [];
      minNode = null;
      nextId = 0;
      isConsolidating = false;
      document.getElementById("btnInsert").disabled = false;
      document.getElementById("btnExtract").disabled = false;
      document.getElementById("btnStep").disabled = true;
      document.getElementById("degreeArrayCont").style.display = "none";
      updateUI("Heap reset.");
    }

    function insert() {
      const input = document.getElementById("valInput");
      const val = parseInt(input.value);
      if (isNaN(val)) return;
      input.value = "";
      
      const newNode = { id: nextId++, val: val, degree: 0, children: [], marked: false, active: false };
      
      rootList.push(newNode);
      if (!minNode || val < minNode.val) minNode = newNode;
      
      updateUI(`Inserted ${val} lazily to root list.`);
    }

    function extractMin() {
      if (rootList.length === 0) {
        updateUI("Heap is empty.");
        return;
      }
      if(isConsolidating) return;
      
      const z = minNode;
      const minIdx = rootList.indexOf(z);
      rootList.splice(minIdx, 1);
      
      // Add children to root list
      for (const child of z.children) {
        child.marked = false;
        rootList.push(child);
      }
      
      if (rootList.length === 0) {
        minNode = null;
        updateUI(`Extracted ${z.val}. Heap is now empty.`);
        return;
      }
      
      // Start Consolidation
      isConsolidating = true;
      pendingRoots = [...rootList]; // copy to process
      rootList = []; // clear root list, will rebuild from A
      A = new Array(MAX_DEGREE).fill(null);
      currentX = null;
      
      document.getElementById("btnInsert").disabled = true;
      document.getElementById("btnExtract").disabled = true;
      document.getElementById("btnStep").disabled = false;
      document.getElementById("degreeArrayCont").style.display = "flex";
      
      // Clear all UI slots
      for(let i=0; i<MAX_DEGREE; i++) document.getElementById(`val-${i}`).innerText = "";
      
      updateUI(`Extracted minimum ${z.val}. Starting Consolidation. Click 'Step Consolidation'.`);
    }

    function clearActive() {
      const resetActive = (node) => {
          node.active = false;
          node.children.forEach(resetActive);
      }
      pendingRoots.forEach(resetActive);
      A.forEach(n => { if(n) resetActive(n); });
      if(currentX) resetActive(currentX);
    }

    function step() {
      if (!isConsolidating) return;
      clearActive();
      
      if (currentX === null) {
        if (pendingRoots.length === 0) {
          // Finish consolidation
          finishConsolidation();
          return;
        }
        // Pop next root to process
        currentX = pendingRoots.shift();
        currentX.active = true;
        updateUI(`Processing root ${currentX.val} with degree ${currentX.degree}. Checking A[${currentX.degree}].`);
        render();
        return;
      }
      
      // We have a currentX, check A
      let d = currentX.degree;
      if (A[d] !== null) {
        let y = A[d];
        y.active = true;
        currentX.active = true;
        
        if (currentX.val > y.val) {
          // Swap
          let temp = currentX; currentX = y; y = temp;
        }
        
        updateUI(`Collision at A[${d}]. Linking ${y.val} under ${currentX.val}. Degree increases to ${d+1}.`);
        
        // Link y under currentX
        y.marked = false;
        currentX.children.push(y);
        currentX.degree++;
        A[d] = null;
        document.getElementById(`val-${d}`).innerText = "";
        
        // Keep currentX active to process again
        render();
      } else {
        // Place in A
        A[d] = currentX;
        document.getElementById(`val-${d}`).innerText = currentX.val;
        updateUI(`Placed ${currentX.val} into A[${d}].`);
        currentX = null; // Done with this one, move to next
        render();
      }
    }
    
    function finishConsolidation() {
      rootList = [];
      minNode = null;
      for (let i = 0; i < MAX_DEGREE; i++) {
        if (A[i] !== null) {
          rootList.push(A[i]);
          if (!minNode || A[i].val < minNode.val) {
            minNode = A[i];
          }
        }
      }
      isConsolidating = false;
      document.getElementById("btnInsert").disabled = false;
      document.getElementById("btnExtract").disabled = false;
      document.getElementById("btnStep").disabled = true;
      document.getElementById("degreeArrayCont").style.display = "none";
      updateUI("Consolidation complete. Root list rebuilt.");
      render();
    }

    function updateUI(msg) {
      document.getElementById("message").innerText = msg;
      render();
    }

    function render() {
      const canvas = document.getElementById("canvas");
      canvas.innerHTML = "";
      
      let renderList = [];
      if (isConsolidating) {
         // Render pending roots, currentX, and A
         renderList = [...pendingRoots];
         if (currentX) renderList.push(currentX);
         A.forEach(n => { if (n) { n.inArray = true; renderList.push(n); } });
      } else {
         renderList = rootList;
      }
      
      if (renderList.length === 0) return;

      // Compute layout
      let startX = 40;
      let firstCenter = null;
      let lastCenter = null;
      
      for (let i = 0; i < renderList.length; i++) {
        const root = renderList[i];
        const bbox = computeTreeWidth(root);
        const center = startX + bbox / 2;
        
        if (i === 0) firstCenter = center;
        lastCenter = center;
        
        // Draw root list edges (dashed)
        if (i < renderList.length - 1 && !isConsolidating) {
          const nextRoot = renderList[i+1];
          const nextBbox = computeTreeWidth(nextRoot);
          const nextCenter = startX + bbox + 20 + nextBbox/2;
          
          const edge = document.createElement("div");
          edge.className = "edge root-edge";
          edge.style.width = (nextCenter - center) + "px";
          edge.style.left = center + "px";
          edge.style.top = "40px";
          canvas.appendChild(edge);
        }
        
        drawTree(root, center, 40, canvas, root === minNode && !isConsolidating);
        startX += bbox + 20;
      }
      
      // Draw circular loop if not consolidating
      if (!isConsolidating && renderList.length > 1 && firstCenter !== null && lastCenter !== null) {
          const circular = document.createElement("div");
          circular.className = "circular-link";
          circular.style.left = firstCenter + "px";
          circular.style.width = (lastCenter - firstCenter) + "px";
          circular.style.top = "40px";
          circular.style.height = "30px";
          canvas.appendChild(circular);
      }
    }

    function computeTreeWidth(node) {
      if (node.degree === 0) return 40;
      let width = 0;
      for (const child of node.children) {
        width += computeTreeWidth(child);
      }
      return Math.max(40, width);
    }

    function drawTree(node, x, y, canvas, isMinRoot = false) {
      // Draw children
      if (node.children.length > 0) {
        let childX = x - (computeTreeWidth(node) / 2) + 20;
        const childY = y + 60;
        
        for (const child of node.children) {
          const cWidth = computeTreeWidth(child);
          const cx = childX + (cWidth / 2) - 20;
          
          const dist = Math.hypot(cx - x, childY - y);
          const angle = Math.atan2(childY - y, cx - x);
          
          const edge = document.createElement("div");
          edge.className = "edge";
          edge.style.width = dist + "px";
          edge.style.left = x + "px";
          edge.style.top = y + "px";
          edge.style.transform = `rotate(${angle}rad)`;
          canvas.appendChild(edge);
          
          drawTree(child, cx, childY, canvas);
          childX += cWidth;
        }
      }
      
      const el = document.createElement("div");
      let classes = "node";
      if (isMinRoot) classes += " min";
      if (node.marked) classes += " marked";
      if (node.active) classes += " active";
      if (node.inArray) classes += " in-array";
      node.inArray = false; // reset for next render
      
      el.className = classes;
      el.innerText = node.val;
      el.style.left = x + "px";
      el.style.top = y + "px";
      canvas.appendChild(el);
    }
    
    initUI();
    
    window.addEventListener('load', () => {
       const height = document.body.scrollHeight;
       window.parent.postMessage({type: 'widget-resize', height: height + 20}, '*');
    });
  </script>
</body>
</html>
