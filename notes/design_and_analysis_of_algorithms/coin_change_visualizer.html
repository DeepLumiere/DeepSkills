<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="lumi_theme.css">
  <style>
    body { margin: 0; padding: 20px; }
    h2 { margin-top: 0; margin-bottom: 8px; }
    .widget-container { width: 100%; max-width: 900px; margin: 0 auto; display: flex; flex-direction: column; gap: var(--lumi-sys-spacing--m, 12px); }
    #canvas { width: 100%; height: 300px; background: transparent; overflow-y: auto; padding: 20px; box-sizing: border-box; }
    
    .coin-container { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 10px; }
    .coin { width: 50px; height: 50px; border-radius: 50%; background: var(--surface-bright, #fff); border: 2px solid var(--primary, #3186ff); display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 18px; color: var(--on-surface); box-shadow: var(--lumi-sys-elevation--level1); transition: transform 0.3s; animation: popIn 0.3s ease-out forwards; }
    
    @keyframes popIn {
      0% { transform: scale(0); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }
    
    .status-panel { display: flex; justify-content: space-between; width: 100%; margin-top: 15px; font-size: 18px; font-weight: bold; font-family: var(--ff-sans); color: var(--on-surface); }
    #message { font-family: var(--ff-sans); font-size: 15px; color: var(--on-surface-variant); min-height: 20px; font-style: italic; margin-top: 8px; }
    
    .denom-list { display: flex; gap: 8px; margin-bottom: 15px; flex-wrap: wrap; justify-content: center;}
    .denom { padding: 4px 8px; background: var(--surface-container, #f2f0f0); border-radius: 4px; font-family: var(--ff-mono); font-size: 14px; border: 1px solid var(--stroke-default, #e3e3e3); color: var(--on-surface); }
    .denom.active { background: var(--accent-container, #dcf1ff); border-color: var(--primary, #3186ff); color: var(--primary, #3186ff); font-weight: bold; }
    
    .control-deck { background-color: var(--lumi-sys-color--surface-container, #f2f0f0); padding: 16px; border-radius: 16px; display: flex; flex-direction: column; gap: 16px; }
    .action-row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
    .playback-bar { display: flex; justify-content: space-between; align-items: center; border-top: 1px solid var(--stroke-default); padding-top: 12px; }
    .playback-btns { display: flex; gap: 8px; }
  </style>
</head>
<body>

  <div class="widget-container">
    <div class="lumi-card" style="padding: 20px;">
      <h2 class="lumi-card-title">Greedy Coin Change Visualizer</h2>
      <p class="lumi-card-subtitle">Indian Currency System: Greedily pick the largest denomination &le; remaining amount.</p>
    </div>

    <div class="lumi-card" style="padding: 16px;">
      <div class="denom-list" id="denomList"></div>
      <div class="status-panel">
        <div id="remainingTxt">Remaining: 0</div>
        <div id="coinCountTxt">Coins: 0</div>
      </div>
      <div id="canvas">
        <div class="coin-container" id="coinContainer"></div>
      </div>
    </div>

    <div class="control-deck">
      <div id="message">Ready. Enter an amount and click Start.</div>
      
      <div class="action-row">
        <input type="number" id="valInput" class="lumi-input" style="width: 200px; min-height: 40px;" placeholder="Amount (e.g. 187)">
        <button id="btnStart" class="lumi-btn lumi-btn--primary" onclick="startChange()">Start Change</button>
      </div>

      <div class="playback-bar">
        <div style="flex: 1;"></div>
        <div class="playback-btns">
          <button class="lumi-btn lumi-btn--ghost" onclick="reset()">Reset</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    const denominations = [500, 100, 50, 20, 10, 5, 2, 1];
    let remaining = 0;
    let coins = [];
    let intervalId = null;

    function initUI() {
      const list = document.getElementById("denomList");
      list.innerHTML = "";
      denominations.forEach(d => {
        const el = document.createElement("div");
        el.className = "denom";
        el.id = `denom-${d}`;
        el.innerText = `₹${d}`;
        list.appendChild(el);
      });
    }

    function reset() {
      if (intervalId) clearInterval(intervalId);
      remaining = 0;
      coins = [];
      document.getElementById("coinContainer").innerHTML = "";
      document.getElementById("btnStart").disabled = false;
      document.querySelectorAll(".denom").forEach(el => el.classList.remove("active"));
      updateUI();
      document.getElementById("message").innerText = "Reset. Enter amount.";
    }

    function startChange() {
      const val = parseInt(document.getElementById("valInput").value);
      if (isNaN(val) || val <= 0) return;
      
      reset();
      remaining = val;
      document.getElementById("btnStart").disabled = true;
      updateUI();
      document.getElementById("message").innerText = `Target: ₹${val}. Looking for largest coin...`;
      
      intervalId = setInterval(stepChange, 600);
    }

    function stepChange() {
      if (remaining <= 0) {
        clearInterval(intervalId);
        document.getElementById("message").innerText = `Done! Used ${coins.length} coins.`;
        document.querySelectorAll(".denom").forEach(el => el.classList.remove("active"));
        return;
      }

      // Find largest coin
      let selectedCoin = 0;
      for (let d of denominations) {
        if (d <= remaining) {
          selectedCoin = d;
          break;
        }
      }

      // Highlight denom
      document.querySelectorAll(".denom").forEach(el => el.classList.remove("active"));
      document.getElementById(`denom-${selectedCoin}`).classList.add("active");

      // Take coin
      coins.push(selectedCoin);
      remaining -= selectedCoin;
      
      // Animate coin
      const container = document.getElementById("coinContainer");
      const coinEl = document.createElement("div");
      coinEl.className = "coin";
      coinEl.innerText = selectedCoin;
      container.appendChild(coinEl);
      
      document.getElementById("message").innerText = `Took ₹${selectedCoin}. Remaining: ₹${remaining}`;
      updateUI();
      
      // Auto-scroll
      const canvas = document.getElementById("canvas");
      canvas.scrollTop = canvas.scrollHeight;
    }

    function updateUI() {
      document.getElementById("remainingTxt").innerText = `Remaining: ₹${remaining}`;
      document.getElementById("coinCountTxt").innerText = `Coins: ${coins.length}`;
    }

    initUI();
    
    const notifyHeight = () => {
       const height = document.body.scrollHeight;
       window.parent.postMessage({type: 'widget-resize', height: height + 20}, '*');
    };
    window.addEventListener('load', notifyHeight);
    new ResizeObserver(notifyHeight).observe(document.querySelector('.widget-container') || document.body);
  </script>
</body>
</html>
