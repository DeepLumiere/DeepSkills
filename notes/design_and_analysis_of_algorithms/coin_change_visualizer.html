<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <style>
    body { font-family: sans-serif; display: flex; flex-direction: column; align-items: center; background: #fdfcfc; margin: 0; padding: 20px; }
    h2 { margin-top: 0; }
    .controls { margin-bottom: 20px; display: flex; gap: 10px; align-items: center; }
    input { padding: 8px; font-size: 16px; border: 1px solid #ccc; border-radius: 4px; width: 80px; }
    button { padding: 8px 16px; font-size: 16px; cursor: pointer; border: none; border-radius: 4px; background: #3186ff; color: white; transition: 0.2s; }
    button:hover { background: #2565c8; }
    button:disabled { background: #ccc; cursor: not-allowed; }
    #canvas { width: 100%; max-width: 800px; height: 300px; background: white; border: 1px solid #ddd; border-radius: 8px; overflow-y: auto; padding: 20px; box-sizing: border-box; }
    
    .coin-container { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 10px; }
    .coin { width: 50px; height: 50px; border-radius: 50%; background: #ffd700; border: 2px solid #daa520; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 18px; color: #b8860b; box-shadow: 0 4px 6px rgba(0,0,0,0.1); transition: transform 0.3s; animation: popIn 0.3s ease-out forwards; }
    
    @keyframes popIn {
      0% { transform: scale(0); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }
    
    .status-panel { display: flex; justify-content: space-between; width: 100%; max-width: 800px; margin-top: 15px; font-size: 18px; font-weight: bold; }
    #message { color: #555; font-style: italic; font-weight: normal; font-size: 16px; margin-top: 10px;}
    
    .denom-list { display: flex; gap: 8px; margin-bottom: 15px; flex-wrap: wrap; justify-content: center;}
    .denom { padding: 4px 8px; background: #f2f0f0; border-radius: 4px; font-family: monospace; font-size: 14px; border: 1px solid #ccc;}
    .denom.active { background: #dcf1ff; border-color: #3186ff; color: #3186ff; font-weight: bold; }
  </style>
</head>
<body>

  <h2>Greedy Coin Change Visualizer</h2>
  
  <div class="denom-list" id="denomList"></div>

  <div class="controls">
    <input type="number" id="valInput" placeholder="Amount (e.g. 187)">
    <button id="btnStart" onclick="startChange()">Start Change</button>
    <button onclick="reset()">Reset</button>
  </div>
  
  <div class="status-panel">
    <div id="remainingTxt">Remaining: 0</div>
    <div id="coinCountTxt">Coins: 0</div>
  </div>
  <div id="message">Enter an amount and click Start to begin.</div>

  <div id="canvas">
    <div class="coin-container" id="coinContainer"></div>
  </div>

  <script>
    const denominations = [500, 100, 50, 20, 10, 5, 2, 1];
    let remaining = 0;
    let coins = [];
    let intervalId = null;

    function initUI() {
      const list = document.getElementById("denomList");
      list.innerHTML = "";
      denominations.forEach(d => {
        const el = document.createElement("div");
        el.className = "denom";
        el.id = `denom-${d}`;
        el.innerText = `₹${d}`;
        list.appendChild(el);
      });
    }

    function reset() {
      if (intervalId) clearInterval(intervalId);
      remaining = 0;
      coins = [];
      document.getElementById("coinContainer").innerHTML = "";
      document.getElementById("btnStart").disabled = false;
      document.querySelectorAll(".denom").forEach(el => el.classList.remove("active"));
      updateUI();
      document.getElementById("message").innerText = "Reset. Enter amount.";
    }

    function startChange() {
      const val = parseInt(document.getElementById("valInput").value);
      if (isNaN(val) || val <= 0) return;
      
      reset();
      remaining = val;
      document.getElementById("btnStart").disabled = true;
      updateUI();
      document.getElementById("message").innerText = `Target: ₹${val}. Looking for largest coin...`;
      
      intervalId = setInterval(stepChange, 600);
    }

    function stepChange() {
      if (remaining <= 0) {
        clearInterval(intervalId);
        document.getElementById("message").innerText = `Done! Used ${coins.length} coins.`;
        document.querySelectorAll(".denom").forEach(el => el.classList.remove("active"));
        return;
      }

      // Find largest coin
      let selectedCoin = 0;
      for (let d of denominations) {
        if (d <= remaining) {
          selectedCoin = d;
          break;
        }
      }

      // Highlight denom
      document.querySelectorAll(".denom").forEach(el => el.classList.remove("active"));
      document.getElementById(`denom-${selectedCoin}`).classList.add("active");

      // Take coin
      coins.push(selectedCoin);
      remaining -= selectedCoin;
      
      // Animate coin
      const container = document.getElementById("coinContainer");
      const coinEl = document.createElement("div");
      coinEl.className = "coin";
      coinEl.innerText = selectedCoin;
      container.appendChild(coinEl);
      
      document.getElementById("message").innerText = `Took ₹${selectedCoin}. Remaining: ₹${remaining}`;
      updateUI();
      
      // Auto-scroll
      const canvas = document.getElementById("canvas");
      canvas.scrollTop = canvas.scrollHeight;
    }

    function updateUI() {
      document.getElementById("remainingTxt").innerText = `Remaining: ₹${remaining}`;
      document.getElementById("coinCountTxt").innerText = `Coins: ${coins.length}`;
    }

    initUI();
    
    window.addEventListener('load', () => {
       const height = document.body.scrollHeight;
       window.parent.postMessage({type: 'widget-resize', height: height + 20}, '*');
    });
  </script>
</body>
</html>
