site_name: DeepSkills
site_description: DeepSkills Knowledge Base and Engineering Notes
site_author: DeepLumiere
site_url: https://deeplumiere.github.io/DeepSkills/

repo_name: DeepLumiere/DeepSkills
repo_url: https://github.com/DeepLumiere/DeepSkills
edit_uri: edit/main/notes/

docs_dir: 'notes'

theme:
  name: material
  # Points directly to notes/logo.svg
  logo: logo.svg
  favicon: logo.svg
  font:
    text: Plus Jakarta Sans
    code: JetBrains Mono

  palette:
    # Dark Mode (Default)
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: cyan
      toggle:
        icon: material/weather-night
        name: Switch to light mode

    # Light Mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: cyan
      toggle:
        icon: material/weather-sunny
        name: Switch to dark mode

  features:
    - navigation.instant        # Smooth client-side routing
    - navigation.tracking       # Active header scroll tracking
    - navigation.sections       # Sidebar folder section headers
    - navigation.expand         # Automatically expand sidebar items
    - navigation.top            # Back to top button
    - navigation.footer         # Next/Prev footer navigation
    - search.suggest            # Auto-suggest search term completions
    - search.highlight          # Highlight matching query text
    - content.code.copy         # Copy code block button
    - content.code.annotate     # In-line code annotations
    - content.action.edit       # Direct GitHub edit button

extra_css:
  - stylesheets/extra.css

# MathJax & LaTeX Support Scripts
extra_javascript:
  - javascripts/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

markdown_extensions:
  # LaTeX Math Support ($...$ and $$...$$)
  - pymdownx.arithmatex:
      generic: true

  # Code Blocks & Mermaid Diagram Support
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - admonition
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
