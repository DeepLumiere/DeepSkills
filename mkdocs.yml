site_name: DeepSkills
site_description: DeepSkills Knowledge Base and Engineering Notes
site_author: DeepLumiere
site_url: https://deeplumiere.github.io/DeepSkills/

repo_name: DeepLumiere/DeepSkills
repo_url: https://github.com/DeepLumiere/DeepSkills
edit_uri: edit/main/notes/

docs_dir: 'notes'

theme:
  name: material
  # Points directly to notes/logo.svg
  logo: logo.svg
  favicon: logo.svg
  font:
    text: Plus Jakarta Sans
    code: JetBrains Mono

  palette:
    # Dark Mode (Default)
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: cyan
      toggle:
        icon: material/weather-night
        name: Switch to light mode

    # Light Mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: cyan
      toggle:
        icon: material/weather-sunny
        name: Switch to dark mode

  features:
    - navigation.instant        # Smooth client-side routing
    - navigation.tracking       # Active header scroll tracking
    - navigation.sections       # Sidebar folder section headers
    - navigation.expand         # Automatically expand sidebar items
    - navigation.top            # Back to top button
    - navigation.footer         # Next/Prev footer navigation
    - search.suggest            # Auto-suggest search term completions
    - search.highlight          # Highlight matching query text
    - content.code.copy         # Copy code block button
    - content.code.annotate     # In-line code annotations
    - content.action.edit       # Direct GitHub edit button

extra_css:
  - stylesheets/extra.css

# MathJax & LaTeX Support Scripts
extra_javascript:
  - javascripts/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

markdown_extensions:
  # LaTeX Math Support ($...$ and $$...$$)
  - pymdownx.arithmatex:
      generic: true

  # Code Blocks & Mermaid Diagram Support
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - admonition
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Hardware & Microprocessors:
      - Microprocessors & Interfacing: MI_ClassTest.md
  - Algorithms & Networking:
      - Design & Analysis of Algorithms:
          - Complete Notes (Unit 1 & 2): DAA_Unit1_and_Unit2_Complete_Notes.md
          - Unit 1 Notes: DAA_Unit1_Elementary_Algorithmic_Notes.md
          - Unit 2 Notes: DAA_Unit2_Analysis_of_Algorithms_Notes.md
      - Computer Networks:
          - Class Test Complete: CompNet_ClassTest.md
          - Ch 1 - Introduction: Chapter_1_Introduction.md
          - Ch 3 - Data Link Layer: Chapter_3_Data_Link_Layer.md
      - Data Communication:
          - Chapter 1: DC_Chapter1_Notes.md
          - Chapter 2: DC_Chapter2_Notes.md
          - Chapter 3: DC_Chapter3_Notes.md
          - Chapter 4: DC_Chapter4_Notes.md
          - Chapter 5: DC_Chapter5_Notes.md
          - Chapter 6: DC_Chapter6_Notes.md
          - Chapter 7: DC_Chapter7_Notes.md
          - Chapter 8: DC_Chapter8_Notes.md
          - Chapter 10: DC_Chapter10_Notes.md
  - Machine Learning & Data Science:
      - Machine Learning Overview: 1Machine_Learning_and_its_Applications_Notes.md
      - Linear Regression: Linear_Regression_Notes.md
      - Multivariate Linear Regression: Multivariate_Linear_Regression_Notes.md
      - Regularization: Regularization_Notes.md
      - Prob & Stats for ML: ps4ml_Notes.md
  - Data Analysis & Visualization:
      - Ch 1 - Introduction: Chapter1_Introduction_to_DAV.md
      - Ch 2 - Types of Data: Chapter2_Types_of_Data.md
      - Ch 3 - Dataset & Attributes: Chapter3_Dataset_and_Attributes.md
      - Ch 4 - Statistical Descriptions: Chapter4_Statistical_Descriptions.md
      - Ch 5 - Data Preprocessing: Chapter5_Data_Preprocessing.md
  - Web Development:
