site_name: DeepSkills
site_description: Personal notes and documentation
site_author: DeepLumiere
site_url: https://deeplumiere.github.io/DeepSkills/

# Repository metadata
repo_name: DeepLumiere/DeepSkills
repo_url: https://github.com/DeepLumiere/DeepSkills
edit_uri: edit/main/notes/

# Directory containing markdown files
docs_dir: 'notes'

theme:
  name: material
  language: en
  
  # Branding & Visual Options
  palette:
    # Light Mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    # Dark Mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

  # Features (UI/UX Extensions)
  features:
    - navigation.instant        # Loads pages without refreshing
    - navigation.tracking       # Updates URL as you scroll
    - navigation.tabs           # Top-level navigation tabs
    - navigation.tabs.sticky    # Keep navigation tabs visible
    - navigation.sections       # Render sections in sidebar
    - navigation.expand         # Expand all sections by default
    - navigation.top            # Back to top button
    - navigation.footer         # Footer with next/previous links
    - search.suggest            # Live search auto-completion
    - search.highlight          # Highlight search terms on page
    - search.share              # Search term sharing link
    - content.code.copy         # Copy code block button
    - content.action.edit       # Edit on GitHub button

# Markdown Extensions (Formatting & Enhancements)
markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - admonition
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
