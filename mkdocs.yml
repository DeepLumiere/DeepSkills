      - "Chapter 4: Regularization (Ridge & Lasso)": machine_learning/04_Regularization.md
      - "Chapter 5: Probability & Statistics for ML": machine_learning/05_Probability_and_Statistics_for_ML.md
      - "Chapter 6: KNN, Naive Bayes & Decision Trees": machine_learning/06_KNN_Naive_Bayes_Decision_Trees.md
  - Computer Networks:
